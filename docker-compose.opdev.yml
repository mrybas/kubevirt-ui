# Local harness for the operator migration: the backend built from this branch,
# pointed at the live dev cluster, with the image and VM paths routed through
# the operator. Kept separate from docker-compose.override.yml so the existing
# harness there is left alone; run it explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.opdev.yml up -d
services:
  backend:
    environment:
      - AUTH_TYPE=none
      - OPERATOR_IMAGE_ENABLED=true
      - OPERATOR_VM_ENABLED=true
      # Phase 1 of the underlay cutover: with this on the backend stops
      # building the fabric and stops healing the gateway label on read, so the
      # operator can be unpaused without two writers ever overlapping.
      - OPERATOR_UNDERLAY_ENABLED=true
      # Copied from the in-cluster Deployment, which is the authority on what
      # this site's product configuration is. Without them `b3_enabled()` is
      # false and the create path writes a VPC with no external plane at all —
      # so a comparison against the networks the UAT run built would be a
      # comparison against a differently configured product, and would have
      # "found" a difference that is mine.
      - B3_BGP_PEER=10.198.175.254
      - B3_VPC_GATEWAY=10.199.4.254
      - B3_LOCAL_ASN=65030
      - B3_PEER_ASN=65000
      - B3_FRR_NAMESPACE=o0-metallb
      - TENANTS_CP_TRANSIT_SUBNET=cp-transit
      - TENANT_SUPERNET=10.200.0.0/14
      - TENANT_VPC_PREFIX=22
  frontend:
    environment:
      - VITE_API_URL=http://localhost:8888
