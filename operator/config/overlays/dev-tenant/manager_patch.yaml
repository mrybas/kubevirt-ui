apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      serviceAccountName: controller-manager
      containers:
        - name: manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --metrics-secure=false
            - --domains=tenant
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            # No admission here: the webhook configuration points at the vm
            # deployment's service, and a second server answering for it would
            # be a coin toss.
            - name: ENABLE_WEBHOOKS
              value: "false"
            # The same three names the backend reads, deliberately: two
            # deployments configured by different variable names for the same
            # fact drift apart in silence, and the silence looks like a check
            # that passed.
            - name: TENANTS_CP_METALLB_POOL
              value: cp-transit-pool
            - name: TENANTS_CP_METALLB_NAMESPACE
              value: o0-metallb
            # Without this the pool-versus-excludeIps invariant does not run at
            # all, and "no complaint" reads exactly like "checked and fine".
            - name: TENANTS_CP_TRANSIT_SUBNET
              value: cp-transit
