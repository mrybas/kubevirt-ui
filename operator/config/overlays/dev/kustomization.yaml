# Dev overlay: the operator under development, deployed by hand.
#
# It lives in its own namespace and is installed with kustomize, deliberately
# bypassing both the kubevirt-ui helm chart and Flux. The stand's UI pipeline
# must keep working untouched while the operator is being written, and a dev
# build that could be pulled into the chart's release path would eventually be.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubevirt-ui-operator-dev
# namePrefix comes from ../../default; setting it again here would double it.

resources:
  - ../../default

patches:
  # Metrics on plain HTTP for the dev stand: the point here is to read the
  # counters (patches_total above all), not to rehearse metrics TLS.
  - path: manager_dev_patch.yaml
    target:
      kind: Deployment
      name: controller-manager
  # …which also means the metrics certificate has no consumer. It ships from
  # the base with unresolved placeholders in its dnsNames, so leaving it in
  # would put a permanently failing Certificate on the cluster.
  - path: drop_metrics_cert.yaml
  # The guard only governs namespaces the product manages. Without this it
  # would police every namespace on the cluster, including ones it knows
  # nothing about.
  - path: guard_namespace_selector.yaml

# The base computes the webhook certificate's dnsNames from the service's
# namespace, which at that point is still the base namespace. Re-running the
# two replacements here recomputes them after this overlay has moved everything
# into the dev namespace — otherwise the certificate is issued for a hostname
# nothing answers on, and every admission call fails TLS verification.
replacements:
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: .metadata.namespace
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: serving-cert
        fieldPaths:
          - .spec.dnsNames.0
          - .spec.dnsNames.1
        options:
          delimiter: '.'
          index: 1
          create: true

images:
  - name: controller
    newName: ghcr.io/mrybas/kubevirt-ui/operator
    # Replaced by `make deploy-dev IMG=...`; the literal below is only a
    # placeholder so a plain `kustomize build` still renders.
    newTag: dev-latest
