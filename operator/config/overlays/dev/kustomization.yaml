# Dev overlay: the operator under development, deployed by hand.
#
# It lives in its own namespace and is installed with kustomize, deliberately
# bypassing both the kubevirt-ui helm chart and Flux. The stand's UI pipeline
# must keep working untouched while the operator is being written, and a dev
# build that could be pulled into the chart's release path would eventually be.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubevirt-ui-operator-dev
# namePrefix comes from ../../default; setting it again here would double it.

resources:
- ../../default

  # Metrics on plain HTTP for the dev stand: the point here is to read the
  # counters (patches_total above all), not to rehearse metrics TLS.
patches:
- path: manager_dev_patch.yaml
  target:
    kind: Deployment
    name: controller-manager

    # Replaced by `make deploy-dev IMG=...`; the literal below is only a
    # placeholder so a plain `kustomize build` still renders.
images:
- name: controller
  newName: ghcr.io/mrybas/kubevirt-ui/operator
  newTag: dev-042825b
