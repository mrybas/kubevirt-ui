apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      serviceAccountName: controller-manager
      containers:
        - name: manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --metrics-secure=false
            - --domains=network
            # This site's addressing plan, and the reason the isolation floor is
            # one rule rather than one per tenant. It matches the backend's
            # TENANT_SUPERNET because they describe the same thing; the operator
            # checks every tenant network against it on each pass rather than
            # trusting it, because a supernet that did not contain the tenants
            # is a mistake this product has already made.
            - --tenant-supernet=10.200.0.0/14
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            # No admission here: the webhook configuration points at the vm
            # deployment's service, and a second server answering for it would
            # be a coin toss.
            - name: ENABLE_WEBHOOKS
              value: "false"
            # Named so it can be refused: a tenant's workers reach their
            # control plane over this leg, and the tenant controller attaches
            # it. Without the name here, this controller would happily withdraw
            # it when a declaration stops mentioning it — two writers with
            # opposite intentions on the one path that must not flap.
            - name: TENANTS_CP_TRANSIT_SUBNET
              value: cp-transit
