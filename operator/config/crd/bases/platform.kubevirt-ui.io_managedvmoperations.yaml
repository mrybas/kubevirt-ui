---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: managedvmoperations.platform.kubevirt-ui.io
spec:
  group: platform.kubevirt-ui.io
  names:
    kind: ManagedVMOperation
    listKind: ManagedVMOperationList
    plural: managedvmoperations
    shortNames:
    - mvmop
    singular: managedvmoperation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vmName
      name: VM
      type: string
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ManagedVMOperation is one operation on one machine.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ManagedVMOperationSpec is one thing to do to one machine, once.

              Operations are separate objects rather than fields on the VM because they
              have a life of their own: they take minutes, they can fail halfway, and what
              happened needs to be readable afterwards. Everything this replaces ran inside
              an HTTP request and died with it — including, in the case of a restore, the
              only record of whether the machine had been running before it started.
            properties:
              action:
                description: Action to perform.
                enum:
                - Restore
                - Migrate
                - RollbackDisk
                - Recreate
                - Clone
                type: string
              clone:
                description: CloneSpec asks for a copy of a machine.
                properties:
                  startAfterClone:
                    default: false
                    description: StartAfterClone runs the copy once it exists.
                    type: boolean
                  targetName:
                    description: |-
                      TargetName is the name of the copy. Empty lets KubeVirt generate one,
                      which it reports on the clone object.
                    type: string
                type: object
              migrate:
                description: MigrateSpec asks for a running VM to move.
                properties:
                  targetNode:
                    description: |-
                      TargetNode restricts where the machine may land. Empty lets the
                      scheduler choose.

                      It becomes a selector on the migration object, not on the machine. The
                      path this replaces pinned the machine itself with a nodeSelector and
                      nothing ever removed it, so every migrated VM stayed welded to whichever
                      node it had been sent to — the first one it could not leave again.
                    type: string
                type: object
              recreate:
                description: |-
                  RecreateSpec asks for a machine to be wiped back to the image it came from.

                  Destructive by intent — that is what recreating means — but not destructive
                  by accident: the machine is pointed at a fresh disk before the one it was
                  using is removed, so a pass that dies partway leaves a machine that still has
                  a disk described for it.
                type: object
              restore:
                description: RestoreSpec asks for a VM to be put back to a snapshot.
                properties:
                  snapshotName:
                    description: SnapshotName is the VirtualMachineSnapshot to restore
                      from.
                    minLength: 1
                    type: string
                required:
                - snapshotName
                type: object
              rollbackDisk:
                description: |-
                  RollbackDiskSpec asks for one attached disk to be put back to a snapshot.

                  The disk is replaced rather than rewritten: a new one is built from the
                  snapshot, the machine is pointed at it, and only then is the old one removed.
                  The path this replaces deleted the claim first and created its replacement
                  afterwards, so a process that died in between left a machine with no disk at
                  all and nothing anywhere that knew what it had been.
                properties:
                  snapshotName:
                    description: SnapshotName is the VolumeSnapshot to roll back to.
                    minLength: 1
                    type: string
                required:
                - snapshotName
                type: object
              ttlSecondsAfterFinished:
                default: 3600
                description: |-
                  TTLSecondsAfterFinished is how long a finished operation sticks around.
                  Long enough to read what happened, short enough that a busy namespace
                  does not fill with history.
                format: int32
                minimum: 0
                type: integer
              vmName:
                description: VMName is the ManagedVM to act on, in this namespace.
                minLength: 1
                type: string
            required:
            - action
            - vmName
            type: object
            x-kubernetes-validations:
            - message: a Restore operation needs a restore block
              rule: self.action != 'Restore' || has(self.restore)
            - message: a Migrate operation needs a migrate block
              rule: self.action != 'Migrate' || has(self.migrate)
            - message: a RollbackDisk operation needs a rollbackDisk block
              rule: self.action != 'RollbackDisk' || has(self.rollbackDisk)
            - message: an operation is a request to do something once; create a new
                one instead of editing this
              rule: self == oldSelf
          status:
            description: |-
              ManagedVMOperationStatus is the state machine, kept on the object so it
              survives the process that started it.
            properties:
              childName:
                description: |-
                  ChildName is the KubeVirt object doing the work — a
                  VirtualMachineRestore or a VirtualMachineInstanceMigration.
                type: string
              completionTime:
                description: CompletionTime is when it finished, either way.
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: Message explains a failure, or what is being waited on.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Running, Succeeded or Failed.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              replacedDisk:
                description: |-
                  ReplacedDisk is the disk being rolled back, kept so it can be removed
                  once the machine is running on its replacement.
                type: string
              replacementDisk:
                description: |-
                  ReplacementDisk is the disk built from the snapshot during a rollback.

                  Recorded before it is attached and kept until the old one is gone, so a
                  pass that resumes after a crash knows which disk it was in the middle of
                  swapping in rather than starting again and building a second one.
                type: string
              runningBefore:
                description: |-
                  RunningBefore records whether the machine was running when the operation
                  started, so it can be put back that way afterwards.

                  On the object, not in a variable: a restore that stopped the machine and
                  then lost its process left the machine stopped for good, and nothing
                  anywhere remembered that it should not have been.
                type: boolean
              startTime:
                description: StartTime is when the operation began.
                format: date-time
                type: string
              targetName:
                description: TargetName is the machine a Clone produced.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
