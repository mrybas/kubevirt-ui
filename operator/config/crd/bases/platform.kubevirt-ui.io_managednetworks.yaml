---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: managednetworks.platform.kubevirt-ui.io
spec:
  group: platform.kubevirt-ui.io
  names:
    kind: ManagedNetwork
    listKind: ManagedNetworkList
    plural: managednetworks
    shortNames:
    - mnet
    singular: managednetwork
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cidr
      name: CIDR
      type: string
    - jsonPath: .spec.tenant
      name: Tenant
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Attached")].status
      name: Attached
      type: string
    - jsonPath: .status.defaultRouteVia
      name: Via
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ManagedNetwork is a tenant network.

          Its children carry no ownerReferences, and that is the opposite of the choice
          ManagedUnderlay makes. The two are worth reading together, because deleting
          one of these objects is safe and deleting one of those takes an external
          subnet and every gateway on it.

          The difference is adoption. A network is very often written down after it
          already exists and already carries workloads, so describing one must be
          reversible: writing the CR must change nothing, and removing it again must
          change nothing. Ownership would make the second half false — the description
          would have quietly become the thing described, and `kubectl delete` on a note
          would delete a running network. An underlay is the other way round: it is
          built by the object, and a ProviderNetwork with nothing behind it is fabric
          nobody is keeping up.

          The cost is stated rather than hidden: deleting a ManagedNetwork leaves the
          Vpc and Subnet behind. Removing a network is a separate, deliberate act.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ManagedNetworkSpec is a tenant network: one kube-ovn VPC and its default
              subnet, described together because neither is useful alone.
            properties:
              cidr:
                description: CIDR of the default subnet.
                minLength: 1
                type: string
              dnsServer:
                description: |-
                  DNSServer is handed to workloads over DHCP.

                  Empty means the subnet's DHCP options carry no `dns_server`, and
                  workloads get no resolver from the network. That is worth being explicit
                  about rather than defaulting to something plausible: a wrong resolver
                  address looks exactly like a working one until something tries to
                  resolve.
                type: string
              environment:
                type: string
              externalPlane:
                description: ExternalPlane is how this network reaches anything outside
                  itself.
                properties:
                  attachments:
                    description: |-
                      Attachments are the subnets kube-ovn gives this VPC a router port on.

                      Both halves of the attachment are required and each alone does nothing:
                      the master switch that makes kube-ovn read this array, and the array. A
                      VPC with the flag and an empty array got no external port; a VPC with the
                      array and no flag got no ports at all. Both were measured, a day apart,
                      and the flag looked sufficient only because the code that set it always
                      set the array too. This controller sets the flag whenever the array is
                      non-empty, so the pair cannot be written half-way.
                    items:
                      type: string
                    type: array
                  egressSubnet:
                    description: |-
                      EgressSubnet is the attachment the default route leaves through. Its
                      gateway address is read from the Subnet itself rather than configured:
                      the same number in two places is the same number until one of them
                      changes.

                      Empty means no default route, and therefore a VPC that is attached but
                      does not leave. That is a legitimate shape — the control-plane transit
                      plane is exactly that — so it is not an error.
                    type: string
                type: object
              folder:
                type: string
              gateway:
                description: Gateway inside CIDR. Empty means the first host address.
                type: string
              isolated:
                default: true
                description: |-
                  Isolated states whether this network is closed to other tenant networks.

                  It records the decision; it does not write the rules. The ACL composer
                  owns `Subnet.spec.acls`, and two writers of one list is the failure this
                  operator exists to remove. What this flag does here is stamp the opt-out
                  annotation the isolation reconciler reads — written only when the answer
                  is "no", so that its absence means "no choice recorded" and the default
                  is to isolate. The old default ran the other way, and silence read as
                  consent to stay open.
                type: boolean
              namespaces:
                description: |-
                  Namespaces bound to this VPC. A namespace listed here and carrying no
                  explicit logical-switch annotation lands on the default subnet.
                items:
                  type: string
                type: array
              natGateway:
                default: false
                description: |-
                  NATGateway turns on kube-ovn's per-VPC SNAT.

                  Off unless deliberately asked for. kube-ovn keeps one SNAT per logical
                  IP, and on a VPC that also carries a control-plane transit leg that slot
                  belongs to the transit path. Taking it gives the tenant internet and no
                  control plane, with every object reporting healthy — which is how it went
                  unnoticed.
                type: boolean
              role:
                description: |-
                  Role is declared, never inferred.

                  The isolation census used to read the role off the shape of the object
                  and counted the egress gateway's own VPC as a tenant, which handed every
                  tenant a drop on the very address it egresses through. `infrastructure`
                  means this network serves the others.
                type: string
              sharedCIDRs:
                description: SharedCIDRs are prefixes this network may still reach
                  while isolated.
                items:
                  type: string
                type: array
              staticRoutes:
                items:
                  description: NetworkStaticRoute is one route on the VPC router.
                  properties:
                    cidr:
                      minLength: 1
                      type: string
                    nextHopIP:
                      minLength: 1
                      type: string
                    policy:
                      default: policyDst
                      type: string
                  required:
                  - cidr
                  - nextHopIP
                  type: object
                type: array
              tenant:
                type: string
            required:
            - cidr
            type: object
          status:
            description: ManagedNetworkStatus is what the network actually is.
            properties:
              attachments:
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              defaultRouteVia:
                description: |-
                  DefaultRouteVia is the next hop actually written, read from the egress
                  subnet rather than configured. Published because the announcement
                  generator decides what to advertise from this same fact — a network is
                  announced when its default route leads into the external subnet — so the
                  datapath and the announcement cannot drift apart.
                type: string
              gateway:
                type: string
              observedGeneration:
                format: int64
                type: integer
              subnetName:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
