---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: managedvmtemplates.platform.kubevirt-ui.io
spec:
  group: platform.kubevirt-ui.io
  names:
    kind: ManagedVMTemplate
    listKind: ManagedVMTemplateList
    plural: managedvmtemplates
    shortNames:
    - mvmt
    singular: managedvmtemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.imageRef.name
      name: Image
      type: string
    - jsonPath: .spec.compute.cores
      name: Cores
      type: integer
    - jsonPath: .spec.compute.memory
      name: Memory
      type: string
    - jsonPath: .spec.rootDisk.size
      name: Disk
      type: string
    - jsonPath: .status.conditions[?(@.type=="ImageFound")].status
      name: ImageFound
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ManagedVMTemplate is a named set of defaults for creating VMs.

          It replaces a single cluster-wide ConfigMap holding every template as a JSON
          blob under a user-chosen key — where a name collision answered 409 naming a
          template the user could not see, and two concurrent writes lost one of each
          other because the store was rewritten whole with no version check.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ManagedVMTemplateSpec is a named set of defaults for creating
              VMs.
            properties:
              category:
                default: linux
                description: Category groups templates in the picker.
                type: string
              cloudInit:
                description: CloudInit is the base user-data VMs merge their own into.
                properties:
                  userData:
                    description: 'UserData is a #cloud-config document.'
                    type: string
                type: object
              compute:
                description: Compute defaults.
                properties:
                  cores:
                    format: int32
                    minimum: 1
                    type: integer
                  memory:
                    pattern: ^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|K|M|G|T|P|k|m)?$
                    type: string
                  sockets:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  threads:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - cores
                - memory
                type: object
              console:
                description: Console devices for VMs made from this template.
                properties:
                  serial:
                    default: false
                    description: Serial attaches a serial console.
                    type: boolean
                  vnc:
                    default: true
                    description: VNC attaches a graphics device.
                    type: boolean
                type: object
              description:
                description: Description is free text shown next to it.
                maxLength: 512
                type: string
              displayName:
                description: DisplayName is what the picker shows.
                maxLength: 128
                type: string
              imageRef:
                description: |-
                  ImageRef names the ManagedImage VMs from this template are cloned from.

                  A reference to our own resource, not to the generated name of a
                  DataVolume. The old store kept the literal generated name, which meant a
                  template could not be written declaratively at all: the name did not
                  exist until the image had been created and read back.
                properties:
                  name:
                    description: Name of the ManagedImage.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the ManagedImage. Empty means this VM's own namespace.

                      A foreign namespace is allowed only when the image's scope says so and
                      both namespaces belong to the same project or folder. That check is not a
                      formality: measured on the cluster, KubeVirt's admission does not stop a
                      cross-namespace clone, and the clone itself succeeds as long as a Role
                      exists — so this scope rule, not RBAC, is what keeps one team's disk out
                      of another team's VM.
                    type: string
                required:
                - name
                type: object
              osType:
                description: OSType labels the guest operating system family.
                type: string
              rootDisk:
                description: RootDisk defaults.
                properties:
                  size:
                    pattern: ^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|K|M|G|T|P|k|m)?$
                    type: string
                required:
                - size
                type: object
            required:
            - compute
            - imageRef
            - rootDisk
            type: object
          status:
            description: ManagedVMTemplateStatus is what the picker and the VM controller
              read back.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              imageNamespace:
                description: |-
                  ImageNamespace is where the referenced image was resolved, so callers do
                  not have to reimplement "empty means my own namespace".
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
