{{- if .Values.rbac.create -}}
{{- if .Values.rbac.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubevirt-ui.fullname" . }}
  labels:
    {{- include "kubevirt-ui.labels" . | nindent 4 }}
rules:
  # -----------------------------------------------------------------------
  # KubeVirt core resources
  # -----------------------------------------------------------------------
  - apiGroups: ["kubevirt.io"]
    resources:
      - virtualmachines
      - virtualmachineinstances
      - virtualmachineinstancemigrations
      - kubevirts
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # KubeVirt subresources (console, VNC, start/stop/restart, hotplug)
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - virtualmachines/start
      - virtualmachines/stop
      - virtualmachines/restart
      - virtualmachines/addvolume
      - virtualmachines/removevolume
      - virtualmachines/migrate
      - virtualmachineinstances/console
      - virtualmachineinstances/vnc
      - virtualmachineinstances/pause
      - virtualmachineinstances/unpause
    verbs: ["get", "update", "put"]

  # Instance types (read-only)
  - apiGroups: ["instancetype.kubevirt.io"]
    resources:
      - virtualmachineclusterinstancetypes
      - virtualmachineinstancetypes
      - virtualmachineclusterpreferences
      - virtualmachinepreferences
    verbs: ["get", "list", "watch"]

  # -----------------------------------------------------------------------
  # CDI (DataVolumes, golden images)
  # -----------------------------------------------------------------------
  - apiGroups: ["cdi.kubevirt.io"]
    resources:
      - datavolumes
      - datasources
      - dataimportcrons
      - cdis
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Cross-namespace clone. CDI gates this on a subresource that grants nothing
  # by itself: its mutating webhook checks that whoever creates the DataVolume
  # may `create datavolumes/source` in the **source** namespace, and refuses
  # otherwise —
  #
  #   admission webhook "datavolume-mutate.cdi.kubevirt.io" denied the request:
  #   User ... has insufficient permissions in clone source namespace ...
  #
  # T2 puts one golden image per Talos version in a shared namespace and clones
  # it into each tenant, so every worker disk crosses that boundary. Measured as
  # an A/B on one subject: with the rules above alone the clone is denied; with
  # this rule added the same request succeeds.
  #
  # The lab cannot catch this. Its backend holds an admin kubeconfig in
  # `system:masters`, for which the check always passes — so this is a
  # production-only failure, and the only place it shows is here.
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes/source"]
    verbs: ["create"]

  # -----------------------------------------------------------------------
  # KubeVirt snapshots (VirtualMachineSnapshot / VirtualMachineRestore)
  # -----------------------------------------------------------------------
  - apiGroups: ["snapshot.kubevirt.io"]
    resources:
      - virtualmachinesnapshots
      - virtualmachinerestores
    verbs: ["get", "list", "watch", "create", "delete"]

  # -----------------------------------------------------------------------
  # Volume snapshots
  # -----------------------------------------------------------------------
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources:
      - volumesnapshots
      - volumesnapshotclasses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------------------
  # The operator's custom resources
  # -----------------------------------------------------------------------
  # Needed only when an OPERATOR_*_ENABLED flag is on, but granted regardless:
  # the flags are set on the Deployment and a role that has to be widened at the
  # same moment a flag is flipped turns a reversible switch into a two-step
  # migration.
  #
  # This block was missing entirely while four of those paths were already
  # written, and no test or lab run could see it: the development backend talks
  # to the cluster through an admin kubeconfig, so every RBAC-gated path passes
  # by construction. It surfaced only when the deployed backend was asked to
  # read a ManagedUnderlay and answered 403.
  #
  # These rows are not kept by memory. tests/test_helm_rbac_contract.py reads
  # the *_custom_object(plural=...) call sites out of the backend and fails when
  # its REQUIRED list — and therefore this block — falls behind them.
  - apiGroups: ["platform.kubevirt-ui.io"]
    resources:
      - managedvms
    verbs: ["get", "list", "create", "patch", "delete"]

  - apiGroups: ["platform.kubevirt-ui.io"]
    resources:
      - managedvmoperations
    verbs: ["create"]

  - apiGroups: ["platform.kubevirt-ui.io"]
    resources:
      - managedvmtemplates
    verbs: ["list", "create", "delete"]

  - apiGroups: ["platform.kubevirt-ui.io"]
    resources:
      - managedimages
    verbs: ["get", "create", "delete"]

  - apiGroups: ["platform.kubevirt-ui.io"]
    resources:
      - managedunderlays
    verbs: ["get", "create", "patch"]

  - apiGroups: ["platform.kubevirt-ui.io"]
    resources:
      - managednetworks
    verbs: ["get", "create", "delete"]

  # -----------------------------------------------------------------------
  # Core resources
  # -----------------------------------------------------------------------
  # Namespaces — full CRUD for project/environment management
  - apiGroups: [""]
    resources:
      - namespaces
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Nodes — read for cluster overview; patch for BGP label (bgp.py:_label_nodes)
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["get", "list", "watch", "patch"]

  # PVs — read-only for storage overview
  - apiGroups: [""]
    resources:
      - persistentvolumes
    verbs: ["get", "list", "watch"]

  # ServiceAccounts — full CRUD for managing kubevirt-csi SA in tenant namespaces
  # (T3: creates ServiceAccount `kubevirt-csi` in tenant-<name> namespace)
  - apiGroups: [""]
    resources:
      - serviceaccounts
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ServiceAccount token — TokenRequest to mint short-lived kubeconfig tokens
  # (T3: calls serviceaccounts/token subresource to generate kubeconfig credentials)
  - apiGroups: [""]
    resources:
      - serviceaccounts/token
    verbs: ["create"]

  # PVCs — full CRUD for disk management
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ConfigMaps — full CRUD (templates, projects ConfigMap)
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Secrets — full CRUD; read for kubeconfig download/TLS,
  # write for creating `infra-cluster-credentials` Secret in tenant-<name> namespace
  # (T3: stores generated kubeconfig as a Secret so kubevirt-csi can consume it)
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Events, Pods — read for monitoring/console, plus `delete` on pods:
  # restarting a Kamaji control plane means deleting its pods, because Kamaji
  # owns the Deployment and silently reverts the annotation a `rollout
  # restart` writes (tenants_common.restart_control_plane_pods).
  - apiGroups: [""]
    resources:
      - events
      - pods
      - pods/log
    # The write verbs are here to satisfy Kubernetes' anti-escalation rule,
    # not because the UI creates pods: it creates the namespaced `capk-infra`
    # Role (tenants_storage._capk_role_rules) which grants CAPK
    # pods/events/services writes in the tenant namespace, and RBAC refuses to
    # grant a permission the granter does not itself hold cluster-wide. Held
    # only in the namespaced Role, tenant creation dies with
    #   roles "capk-infra" is forbidden: ... attempting to grant RBAC
    #   permissions not currently held
    # and the tenant never gets a worker. See test_helm_rbac_contract.py,
    # which derives this set from the code rather than from memory.
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Services — read + proxy (LINSTOR, metrics)
  - apiGroups: [""]
    resources:
      - services
      - services/proxy
    # update/patch/delete for the same anti-escalation reason as pods above.
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Endpoints — read-only; required by tenants_vpc flow which inspects DNS service
  # readiness before creating ClusterRole system:vpc-dns.  K8s anti-escalation
  # rule: the SA must hold every permission it grants, so it needs read access to
  # the same resources the ClusterRole grants.
  # (backend/app/api/tenants_vpc.py)
  - apiGroups: [""]
    resources:
      - endpoints
    verbs: ["get", "list", "watch"]

  # EndpointSlices — same rationale as Endpoints above; system:vpc-dns grants
  # read access to endpointslices, so the SA must hold it too.
  # (backend/app/api/tenants_vpc.py)
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]

  # ResourceQuotas / LimitRanges
  - apiGroups: [""]
    resources:
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------------------
  # Storage
  # -----------------------------------------------------------------------
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - csistoragecapacities
    verbs: ["get", "list", "watch"]

  # Apps — DaemonSets for BGP speaker deployment
  - apiGroups: ["apps"]
    resources:
      - daemonsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Apps — Deployments: read for discovery (network.py:_find_kubeovn_namespace)
  # and `patch` for the VpcDns service-network route. That route is what lets
  # a VpcDns pod reach the kube-dns ClusterIP; without the verb, DNS in every
  # custom VPC resolves nothing while each object still reports healthy
  # (vpcs.py:_ensure_vpc_dns_service_route).
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch", "patch"]

  # -----------------------------------------------------------------------
  # Networking (Kube-OVN)
  # -----------------------------------------------------------------------
  - apiGroups: ["kubeovn.io"]
    resources:
      - subnets
      - vlans
      - provider-networks
      - ips
      - ip-pools
      - vpcs
      - vpc-peerings
      - vpc-dnses
      - vpc-egress-gateways
      - ovn-eips
      - ovn-snat-rules
      - ovn-dnat-rules
      - ovn-fips
      - security-groups
      # The tenant control-plane VIP, published inside the tenant's own VPC
      # so the join path does not depend on the VPC default route
      # (tenants_capi._ensure_cp_reachable_in_vpc).
      - switch-lb-rules
      # FRR config an egress gateway peers BGP with. One shared object serves
      # every gateway; without it a UI-created VPC is reachable by NAT only
      # (bgp.py — BGPCONF_PLURAL).
      - bgp-confs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["k8s.cni.cncf.io"]
    resources:
      - network-attachment-definitions
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------------------
  # RBAC (project access management)
  # -----------------------------------------------------------------------
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ClusterRoles / ClusterRoleBindings — read access is broad (needed for lookups).
  # Mutations are split below to limit privilege-escalation surface.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]

  # ClusterRole create — cannot be scoped by resourceNames in K8s RBAC (no instance
  # name exists at admission time), so create is kept as a separate broad rule.
  # The backend only ever creates: system:vpc-dns and kubevirt-ui-ns-viewer.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
    verbs: ["create"]

  # ClusterRole update/patch/delete — scoped to the exact names managed by this
  # backend. Prevents the SA from mutating any other ClusterRole (privilege escalation).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
    resourceNames:
      - "system:vpc-dns"
      - "vpc-dns"
      - "kubevirt-ui-admin"
      - "kubevirt-ui-editor"
      - "kubevirt-ui-viewer"
      - "kubevirt-ui-ns-viewer"
      # Shared across tenants, replaced in place by
      # tenants_storage._ensure_cluster_role. Missing here, tenant creation
      # dies at "cannot update resource clusterroles ... at the cluster scope"
      # after the namespace and half the identities already exist.
      - "kubevirt-csi-cluster"
    verbs: ["update", "patch", "delete"]

  # ClusterRoleBinding mutations — kept broad because per-user CRBs are generated
  # with dynamic names (kubevirt-ui-<sanitized-sub>) that cannot be enumerated.
  # Privilege-escalation risk is mitigated by the scoped ClusterRole write rules above.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterrolebindings
    verbs: ["create", "update", "patch", "delete"]

  # "bind" verb — required to create ClusterRoleBindings that reference any of the
  # listed ClusterRoles.  Without it Kubernetes rejects the CRB with a 403 even
  # though the SA already has "create" on clusterrolebindings.  This is the
  # privilege-escalation-prevention mechanism: a principal cannot grant permissions
  # it does not itself possess, so it must explicitly hold "bind" on the target
  # ClusterRole.
  # Ref: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#privilege-escalation-prevention-and-bootstrapping
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
    resourceNames:
      - cluster-admin
      - kubevirt-ui-admin
      - kubevirt-ui-editor
      - kubevirt-ui-viewer
      - kubevirt-ui-ns-viewer
    verbs: ["bind"]

  # "bind" for VpcDns ClusterRoles — extends the whitelist above with the two
  # ClusterRoles created/managed by the tenants_vpc flow.  Without "bind" on
  # system:vpc-dns / vpc-dns the SA cannot create a ClusterRoleBinding that
  # references them, even though it holds "create" on clusterrolebindings.
  # Kept as a separate rule so the VpcDns permission surface is clearly isolated.
  # (backend/app/api/tenants_vpc.py)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
    resourceNames:
      - "system:vpc-dns"
      - "vpc-dns"
    verbs: ["bind"]

  # Subject access review (permission checks)
  - apiGroups: ["authorization.k8s.io"]
    resources:
      - subjectaccessreviews
    verbs: ["create"]

  # -----------------------------------------------------------------------
  # VictoriaMetrics Operator (metrics auto-discovery)
  # -----------------------------------------------------------------------
  - apiGroups: ["operator.victoriametrics.com"]
    resources:
      - vmsingles
    verbs: ["get", "list", "watch"]

  # -----------------------------------------------------------------------
  # Velero (backup/restore/schedules)
  # -----------------------------------------------------------------------
  - apiGroups: ["velero.io"]
    resources:
      - backups
      - restores
      - schedules
      - backupstoragelocations
      - deletebackuprequests
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------------------
  # Batch (CronJobs for scheduled VM actions)
  # -----------------------------------------------------------------------
  - apiGroups: ["batch"]
    resources:
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------------------
  # Cilium network policies
  # -----------------------------------------------------------------------
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
      - ciliumclusterwidenetworkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------------------
  # Kyverno policies (per-VPC DNS-injection ClusterPolicy + future use)
  # -----------------------------------------------------------------------
  - apiGroups: ["kyverno.io"]
    resources:
      - clusterpolicies
      - policies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------------------
  # cert-manager — PKI for Talos tenants
  # -----------------------------------------------------------------------
  # A Talos tenant's CSR signer needs a server certificate, issued per tenant
  # from a per-tenant CA (selfSigned Issuer -> CA -> Issuer(ca) -> cert).
  # Without these the tenant comes up and its workers loop forever waiting on
  # a signer that never gets a certificate (tenants_talos.build_talos_pki).
  - apiGroups: ["cert-manager.io"]
    resources:
      - issuers
      - certificates
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------------------
  # Cluster API (tenant clusters)
  # -----------------------------------------------------------------------
  - apiGroups: ["cluster.x-k8s.io"]
    resources:
      - clusters
      - machinedeployments
      # Machines are read to report worker health honestly: a Machine stays
      # Ready while its node is NotReady, so the count has to come from the
      # NodeHealthy condition (tenants_crud._enrich_with_workers).
      - machines
      # A worker whose node dies is only replaced if something remediates it;
      # CAPI stays content while the infrastructure VM exists.
      - machinehealthchecks
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["bootstrap.cluster.x-k8s.io"]
    resources:
      - kubeadmconfigtemplates
      # Talos workers carry their machine config in a TalosConfigTemplate
      # instead — the wizard offers the choice, so both have to be grantable.
      - talosconfigtemplates
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # Choosing Talos workers means installing the Talos bootstrap provider
  # (CABPT) if it is absent. Without this the tenant is created halfway —
  # secrets and PKI land, the provider does not — and the user sees only
  # "Failed to create tenant".
  - apiGroups: ["operator.cluster.x-k8s.io"]
    resources:
      - bootstrapproviders
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: ["controlplane.cluster.x-k8s.io"]
    resources:
      - kamajicontrolplanes
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources:
      - kubevirtmachinetemplates
      - kubevirtclusters
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------------------
  # Flux CD (HelmReleases for tenant addons)
  # -----------------------------------------------------------------------
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------------------
  # IngressClasses — read-only; needed to auto-detect the default ingress
  # controller when TENANTS_INGRESS_CLASS env var is not set.
  # (tenants_common.py: list_ingress_class / read_ingress_class)
  # -----------------------------------------------------------------------
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingressclasses
    verbs: ["get", "list", "watch"]

  # -----------------------------------------------------------------------
  # Traefik IngressRouteTCP — TCP passthrough routes for tenant API servers.
  # Created/deleted per-tenant when ingress controller is Traefik.
  # (tenants_capi.py: _create_tenant_apiserver_ingress → traefik branch)
  # -----------------------------------------------------------------------
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutetcps
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # -----------------------------------------------------------------------
  # Contour HTTPProxy — TLS-passthrough proxies for tenant API servers.
  # Created/deleted per-tenant when ingress controller is Contour.
  # (tenants_capi.py: _create_tenant_apiserver_ingress → contour branch)
  # -----------------------------------------------------------------------
  - apiGroups: ["projectcontour.io"]
    resources:
      - httpproxies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubevirt-ui.fullname" . }}
  labels:
    {{- include "kubevirt-ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubevirt-ui.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubevirt-ui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

---
# Aggregation ClusterRole — Kyverno admission + background controllers
# need to read kube-ovn resources when our per-VPC ClusterPolicy's
# context.apiCall fetches subnets/vpcs (e.g. resolving the list of
# subnets that belong to a given VPC). Kyverno's official ClusterRoles
# `kyverno:admission-controller` and `kyverno:background-controller`
# carry `aggregationRule.clusterRoleSelectors` matching these labels,
# so this rule is auto-included into both — no explicit ClusterRoleBinding
# needed, no need to know the Kyverno SA names.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubevirt-ui.fullname" . }}-kyverno-kubeovn-read
  labels:
    {{- include "kubevirt-ui.labels" . | nindent 4 }}
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["kubeovn.io"]
    resources: [subnets, vpcs, vpc-dnses]
    verbs: [get, list, watch]

{{- else }}
# -----------------------------------------------------------------------
# Namespace-scoped Role (single-namespace mode)
# -----------------------------------------------------------------------
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubevirt-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-ui.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances", "virtualmachineinstancemigrations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - virtualmachines/start
      - virtualmachines/stop
      - virtualmachines/restart
      - virtualmachines/addvolume
      - virtualmachines/removevolume
      - virtualmachineinstances/console
      - virtualmachineinstances/vnc
    verbs: ["get", "update", "put"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes", "datasources"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "configmaps", "events", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "services/proxy"]
    verbs: ["get", "list", "watch", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubevirt-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubevirt-ui.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubevirt-ui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

---
# -----------------------------------------------------------------------
# B3 routed egress: the FRRConfiguration that announces tenant VPC prefixes
# -----------------------------------------------------------------------
# Namespaced on purpose. The backend writes exactly one object here —
# `kubevirt-ui-b3` in the namespace frr-k8s runs in — so a cluster-wide
# grant over every FRRConfiguration would be far more than it needs.
#
# No `delete`: tearing the last VPC down rewrites this object to zero
# prefixes rather than removing it, which is how the announcement is
# withdrawn. Measured in UAT 2026-08-19.
#
# Without this Role the write 403s in a loop while the page still reports
# the prefixes as handed to FRR — the generator works, only the write is
# refused, and the tenant silently has no egress.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubevirt-ui.fullname" . }}-b3
  namespace: {{ include "kubevirt-ui.b3FrrNamespace" . }}
  labels:
    {{- include "kubevirt-ui.labels" . | nindent 4 }}
rules:
  - apiGroups: ["frrk8s.metallb.io"]
    resources: ["frrconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubevirt-ui.fullname" . }}-b3
  namespace: {{ include "kubevirt-ui.b3FrrNamespace" . }}
  labels:
    {{- include "kubevirt-ui.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubevirt-ui.fullname" . }}-b3
subjects:
  - kind: ServiceAccount
    name: {{ include "kubevirt-ui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
