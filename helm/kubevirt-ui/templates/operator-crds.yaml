                default: external
                type: string
              subnetName:
                default: ext-sub
                type: string
              vlanID:
                default: 0
                description: "VLANID is the tag, 0 for untagged.\n\nTagged frames do not always survive an overlay underneath \u2014 measured on\nan OpenNebula VXLAN lab, where two pods on different workers could not\nARP each other while untagged frames between the same NICs were fine."
                format: int32
                maximum: 4094
                minimum: 0
                type: integer
              vlanName:
                default: vlan-external
                type: string
            required:
            - externalCIDR
            - externalGateway
            - interface
            type: object
          status:
            description: ManagedUnderlayStatus is what the fabric actually looks like.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: 'lastTransitionTime is the last time the condition transitioned from one status to another.

                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.'
                      format: date-time
                      type: string
                    message:
                      description: 'message is a human readable message indicating details about the transition.

                        This may be an empty string.'
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: 'observedGeneration represents the .metadata.generation that the condition was set based upon.

                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date

                        with respect to the current state of the instance.'
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: 'reason contains a programmatic identifier indicating the reason for the condition''s last transition.

                        Producers of specific condition types may define expected values and meanings for this field,

                        and whether the values are considered a guaranteed API.

                        The value should be a CamelCase string.

                        This field may not be empty.'
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              daemonSets:
                description: DaemonSets is the state of the workarounds.
                items:
                  description: 'UnderlayDaemonSetStatus is whether a DaemonSet is doing anything, as opposed

                    to whether it exists.'
                  properties:
                    desired:
                      format: int32
                      type: integer
                    detail:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    ready:
                      format: int32
                      type: integer
                    state:
                      description: State is one of running, scheduled-nowhere, not-starting, absent, skipped.
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
              labelHeals:
                description: 'LabelHeals counts how many times this controller has had to put the

                  gateway label back. It is not expected to be zero: on the lab the label

                  was found sitting at an explicit `false` on all three workers with

                  nothing in managedFields claiming it. A number that keeps climbing means

                  something else is still writing it, and is worth chasing; the fabric

                  stays up either way.'
                format: int64
                type: integer
              labelledNodes:
                description: LabelledNodes carry `ovn.kubernetes.io/external-gw=true`.
                items:
                  type: string
                type: array
              observedGeneration:
                format: int64
                type: integer
              provider:
                description: 'Provider is the `<nad>.<namespace>.ovn` string tying the subnet to its

                  NAD, published because kube-ovn compares it character for character and

                  says so only in a refusal.'
                type: string
              readyNodes:
                description: "ReadyNodes are the nodes whose OVS bridge for this provider network came\nup \u2014 kube-ovn's own answer to \"does this NIC exist here\"."
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
