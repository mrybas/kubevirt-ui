apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: managedvms.platform.kubevirt-ui.io
spec:
  group: platform.kubevirt-ui.io
  names:
    kind: ManagedVM
    listKind: ManagedVMList
    plural: managedvms
    shortNames:
    - mvm
    singular: managedvm
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.running
      name: Running
      type: boolean
    - jsonPath: .status.virtualMachineName
      name: VM
      type: string
    - jsonPath: .status.conditions[?(@.type=="Provisioned")].status
      name: Provisioned
      type: string
    - jsonPath: .status.conditions[?(@.type=="ImageReady")].reason
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ManagedVM is a virtual machine the platform owns.
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object.

              Servers should convert recognized schemas to the latest internal value, and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents.

              Servers may infer this from the endpoint the client submits requests to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: "ManagedVMSpec is a virtual machine as the product describes one.\n\nIt is deliberately not a KubeVirt VirtualMachine with extra fields: the\npoint is that a caller says what they want and the controller renders the\ndataVolumeTemplates, the cloud-init, the overcommit arithmetic, the network\nannotations and the VPC resolver \u2014 the parts that were previously spelled out\nonly inside one HTTP handler and therefore did not exist for anyone writing\nmanifests directly."
            properties:
              cloudInit:
                description: CloudInit is merged with the template's user-data.
                properties:
                  userData:
                    description: 'UserData is a #cloud-config document.'
                    type: string
                type: object
              compute:
                description: Compute overrides the template's defaults, and is required without one.
                properties:
                  cores:
                    description: Cores visible to the guest.
                    format: int32
                    minimum: 1
                    type: integer
                  memory:
                    description: Memory for the guest, e.g. 4Gi.
                    pattern: ^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|K|M|G|T|P|k|m)?$
                    type: string
                  sockets:
                    default: 1
                    description: Sockets, defaulting to one.
                    format: int32
                    minimum: 1
                    type: integer
                  threads:
                    default: 1
                    description: Threads per core, defaulting to one.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - cores
                - memory
                type: object
              console:
                description: Console devices.
                properties:
                  serial:
                    default: false
                    description: Serial attaches a serial console.
                    type: boolean
                  vnc:
                    default: true
                    description: VNC attaches a graphics device.
                    type: boolean
                type: object
              disks:
                description: "Disks attached to the machine, beyond its own root disk.\n\nDeclarative, so that what is attached is visible in one place and\nsurvives whatever happens to the process that attached it. A claim marked\npersistent may be listed by exactly one machine \u2014 admission checks that,\nbecause two machines writing one disk corrupts it and neither of them\nfinds out."
                items:
                  description: "DiskAttachment is an existing claim attached to the machine.\n\nThe root disk is not one of these: it is created with the machine and is\ndescribed by rootDisk. These are disks that exist on their own and are\nplugged in \u2014 which is why they are matched by claim rather than rendered,\nand why the machine's own root entry is never touched by this list."
                  properties:
                    bus:
                      default: virtio
                      description: Bus the guest sees the disk on.
                      enum:
                      - virtio
                      - scsi
                      - sata
                      type: string
                    claim:
                      description: 'Claim is the DataVolume or PersistentVolumeClaim to attach, in this

                        namespace.'
                      minLength: 1
                      type: string
                    name:
                      description: 'Name the volume carries inside the machine. Empty means the claim''s own

                        name, which is the usual case; it is separate because the attach dialog

                        lets a person choose one, and dropping that choice silently would be a

                        worse answer than carrying it.'
                      type: string
                  required:
                  - claim
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - claim
                x-kubernetes-list-type: map
              displayName:
                description: DisplayName is the human-facing name.
                maxLength: 100
                type: string
              imageRef:
                description: 'ImageRef clones straight from an image, with no template in between.

                  Mutually exclusive with templateRef.'
                properties:
                  name:
                    description: Name of the ManagedImage.
                    minLength: 1
                    type: string
                  namespace:
                    description: "Namespace of the ManagedImage. Empty means this VM's own namespace.\n\nA foreign namespace is allowed only when the image's scope says so and\nboth namespaces belong to the same project or folder. That check is not a\nformality: measured on the cluster, KubeVirt's admission does not stop a\ncross-namespace clone, and the clone itself succeeds as long as a Role\nexists \u2014 so this scope rule, not RBAC, is what keeps one team's disk out\nof another team's VM."
                    type: string
                required:
                - name
                type: object
              initialPasswordSecretRef:
                description: 'InitialPasswordSecretRef names a Secret holding the first-boot password.


                  A reference rather than the password itself: this object ends up in etcd

                  and, for anything managed as code, in a state file.'
                properties:
                  key:
                    default: password
                    description: Key inside the Secret.
                    type: string
                  name:
                    description: Name of the Secret, in this VM's namespace.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              networkBinding:
                default: bridge
                description: 'NetworkBinding for a VPC-attached primary NIC.


                  bridge lets the guest report its real overlay address; masquerade is the

                  legacy alternative and breaks multicast.'
                enum:
                - bridge
                - masquerade
                type: string
              networks:
                description: 'Networks in order. The first is the primary NIC.


                  Only the primary may be a VPC subnet: a secondary VPC NIC would need a

                  per-subnet attachment definition wrapping the OVN CNI, which does not

                  exist here. Additional NICs must be VLAN-backed.'
                items:
                  description: NetworkAttachment is one NIC.
                  properties:
                    staticIP:
                      description: StaticIP pins the address instead of taking one from IPAM.
                      type: string
                    subnet:
                      description: Subnet is the kube-ovn subnet to attach to.
                      minLength: 1
                      type: string
                  required:
                  - subnet
                  type: object
                type: array
              rootDisk:
                description: RootDisk overrides the template's default, and is required without one.
                properties:
                  size:
                    description: "Size of the root disk. Must be at least the size of the image it is\ncloned from \u2014 CDI refuses a smaller target."
                    pattern: ^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|K|M|G|T|P|k|m)?$
                    type: string
                  storageClass:
                    default: ''
                    description: 'StorageClass for the root disk. Empty means the cluster default.


                      It is deliberately not inherited from the image: images sit on a cheap

                      erasure-coded class and VM disks belong on the replicated one, and

                      inheriting sent every write a VM made to erasure coding.'
                    type: string
                required:
                - size
                type: object
              running:
                default: true
                description: "Running asks for the VM to be on.\n\nThe controller owns runStrategy on the rendered VirtualMachine, so a\n`virtctl start/stop` against a managed VM is reverted \u2014 with an event, never\nsilently. Infrastructure-as-code should ignore changes to this field."
                type: boolean
              ssh:
                description: SSH keys to install in the guest.
                properties:
                  authorizedKeys:
                    description: AuthorizedKeys to write into the guest.
                    items:
                      type: string
                    type: array
                type: object
              templateRef:
                description: 'TemplateRef takes defaults from a template. Mutually exclusive with

                  imageRef.'
                properties:
                  name:
                    description: Name of the template.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            type: object
            x-kubernetes-validations:
            - message: set exactly one of templateRef or imageRef
              rule: has(self.templateRef) != has(self.imageRef)
            - message: 'compute and rootDisk are required when imageRef is used: there is no template to take defaults from'
              rule: '!has(self.imageRef) || (has(self.compute) && has(self.rootDisk))'
          status:
            description: "ManagedVMStatus is the derived state, kept deliberately small.\n\nThe fast-moving facts of a running guest \u2014 address, node, guest-agent\ndetails, VMI phase \u2014 are not mirrored here. Copying them would mean an etcd\nwrite every time a guest breathes, multiplied by every VM on the cluster,\nto reproduce data the UI can already watch at the source."
            properties:
              attachedDisks:
                description: 'AttachedDisks lists the claims this controller has plugged in.


                  Kept so that removing a disk from the spec detaches exactly what was

                  attached from it, and nothing else. A disk plugged in by some other route

                  is left alone rather than reclaimed and then removed as unrecognised.'
                items:
                  type: string
                type: array
              conditions:
                description: Conditions carry the reasons.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: 'lastTransitionTime is the last time the condition transitioned from one status to another.

                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.'
                      format: date-time
                      type: string
                    message:
                      description: 'message is a human readable message indicating details about the transition.

                        This may be an empty string.'
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: 'observedGeneration represents the .metadata.generation that the condition was set based upon.

                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date

                        with respect to the current state of the instance.'
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: 'reason contains a programmatic identifier indicating the reason for the condition''s last transition.

                        Producers of specific condition types may define expected values and meanings for this field,

                        and whether the values are considered a guaranteed API.

                        The value should be a CamelCase string.

                        This field may not be empty.'
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
