apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: managedtenants.platform.kubevirt-ui.io
spec:
  group: platform.kubevirt-ui.io
  names:
    kind: ManagedTenant
    listKind: ManagedTenantList
    plural: managedtenants
    shortNames:
    - mten
    singular: managedtenant
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.folder
      name: Folder
      type: string
    - jsonPath: .spec.environment
      name: Env
      type: string
    - jsonPath: .spec.kubernetesVersion
      name: K8s
      type: string
    - jsonPath: .spec.workers.count
      name: Workers
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ManagedTenant is a tenant Kubernetes cluster.
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object.

              Servers should convert recognized schemas to the latest internal value, and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents.

              Servers may infer this from the endpoint the client submits requests to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: ManagedTenantSpec is a tenant Kubernetes cluster.
            properties:
              addons:
                description: 'Addons are installed into the tenant''s cluster once it answers.


                  The catalogue''s required components are installed whether or not they are

                  listed: a tenant without its CNI is not a smaller tenant, it is a broken

                  one, and leaving that to a checkbox is how a cluster comes up with no

                  network and a green page.'
                items:
                  description: TenantAddon is one thing installed into the tenant's own cluster.
                  properties:
                    id:
                      description: ID names a component of the deployment's addon catalogue.
                      minLength: 1
                      type: string
                    parameters:
                      additionalProperties:
                        type: string
                      description: "Parameters are the knobs that component exposes. What is not given here\ntakes the catalogue's default \u2014 the catalogue is the one statement of\nwhat a component is, and repeating its defaults here would be a second."
                      type: object
                  required:
                  - id
                  type: object
                type: array
              controlPlaneReplicas:
                default: 2
                format: int32
                maximum: 3
                minimum: 1
                type: integer
              displayName:
                maxLength: 128
                minLength: 1
                type: string
              enableOIDC:
                description: "EnableOIDC decides whether the tenant's apiserver accepts the platform's\nidentity provider. Off means no `--oidc-*` flags at all, which is what a\ndeployment whose provider the apiserver cannot reach \u2014 or whose\ncertificate it does not trust \u2014 actually needs."
                type: boolean
              environment:
                minLength: 1
                type: string
              folder:
                description: 'Folder and Environment are what the tenant is scoped to, and they are

                  required: a tenant outside them takes no part in folder authorisation and

                  spends nobody''s quota.'
                minLength: 1
                type: string
              kubernetesVersion:
                default: v1.30.1
                type: string
              network:
                description: 'Network is the VPC the tenant''s machines live in. Empty means the

                  cluster''s default overlay.'
                type: string
              podCIDR:
                default: 10.244.0.0/16
                type: string
              serviceCIDR:
                default: 10.112.0.0/12
                description: "ServiceCIDR is deliberately not the host cluster's own 10.96.0.0/12.\n\nA tenant sharing it makes its kube-proxy hijack the host's DNS address\nfor the tenant's own CoreDNS, and its nodes lose name resolution the\nmoment kube-proxy starts \u2014 after they have already joined. 10.112.0.0/12\nis the adjacent block, disjoint from it, and the host's actual ranges are\nstill checked because a cluster may of course use 10.112 itself."
                type: string
              storage:
                description: "Storage is what the tenant's own workloads may provision inside its\nnamespace, through the CSI driver that turns a PVC in the tenant cluster\ninto a PVC on the host.\n\nSeparate from the workers' disks, and added to them. They used to be two\nResourceQuota objects in one namespace, which Kubernetes applies\nindependently \u2014 so the effective cap was the smaller of the two \u2014 while\nthe folder ceiling, which sums every quota it finds, counted the tenant's\nstorage twice. Measured on this stand: one tenant with both objects\ncounted 220Gi against its folder while reserving 120Gi, and the tenant\nbeside it had only one object, so the double-count was not even\nconsistent."
                properties:
                  allowanceGi:
                    default: 100
                    description: "AllowanceGi is what the tenant's own workloads may provision, on top of\nthe disks its machines need.\n\n**Zero means none**, and that is a real answer rather than a missing one:\na tenant whose storage was never wired has no driver to create a volume\nwith, and giving it an allowance charges its folder for capacity nothing\ncan use. Found by adopting the second live tenant \u2014 the first had storage\nand never asked the question.\nA pointer, and that is the whole point: with a plain int32 and\n`omitempty`, zero is indistinguishable from absent and the API server\napplies the default \u2014 so \"none\" could not be said at all. Absent still\nmeans the default; zero now means zero."
                    format: int32
                    maximum: 10000
                    minimum: 0
                    type: integer
                  className:
                    description: "ClassName is the StorageClass a worker's root clone lands on, and the one\nthe tenant's own volumes use. Empty means the cluster default.\n\nNot the class the shared golden image sits on: that one is meant for an\nerasure-coded pool, because it is read-only reference data cloned many\ntimes, while the clones themselves want replica. Sending a clone to the\ngolden's class was the first version of this and it is a real difference\n\u2014 the live tenants' roots are on `ceph-block`."
                    type: string
                  pvcCount:
                    default: 20
                    description: 'PVCCount caps how many volumes the tenant''s workloads may hold.


                      Zero means no cap is written at all, which is not the same as a cap of

                      zero: the workers'' own root disks are claims in this namespace, and a cap

                      of zero would refuse them and leave the tenant unable to replace a node.

                      A pointer for the same reason as the allowance above.'
                    format: int32
                    maximum: 200
                    minimum: 0
                    type: integer
                type: object
              workers:
                description: TenantWorkers is the shape of the worker pool.
                properties:
                  count:
                    default: 2
                    format: int32
                    maximum: 20
                    minimum: 1
                    type: integer
                  disk:
                    default: 20Gi
                    type: string
                  memory:
                    default: 2Gi
                    type: string
                  os:
                    default: cloud-init
                    description: "OS decides how a worker is bootstrapped, and they are different\nmechanisms rather than different images. `cloud-init` boots a CAPK\ncontainer-disk through a KubeadmConfigTemplate; `talos` swaps the\nbootstrap provider and brings its own per-tenant objects \u2014 a CSR signer\nwith its own PKI, stable machine secrets, a bootstrap token. A Talos node\ncannot be bootstrapped the cloud-init way at all: it asks a trustd signer\nfor a certificate instead."
                    enum:
                    - cloud-init
                    - talos
                    type: string
                  talosVersion:
                    description: 'TalosVersion picks the release to build Talos workers from. Empty means

                      the catalogue''s default. Validated against the same compatibility the

                      wizard renders its list from, so the two cannot offer and refuse

                      different things.'
                    type: string
                  vcpu:
                    default: 2
                    format: int32
                    maximum: 32
                    minimum: 1
                    type: integer
                type: object
            required:
            - displayName
            - environment
            - folder
            type: object
          status:
            description: ManagedTenantStatus is what the tenant actually is.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: 'lastTransitionTime is the last time the condition transitioned from one status to another.

                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.'
                      format: date-time
                      type: string
                    message:
                      description: 'message is a human readable message indicating details about the transition.

                        This may be an empty string.'
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: 'observedGeneration represents the .metadata.generation that the condition was set based upon.

                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date

                        with respect to the current state of the instance.'
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: 'reason contains a programmatic identifier indicating the reason for the condition''s last transition.

                        Producers of specific condition types may define expected values and meanings for this field,

                        and whether the values are considered a guaranteed API.

                        The value should be a CamelCase string.

                        This field may not be empty.'
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              controlPlaneVIP:
                description: "ControlPlaneVIP is the address MetalLB gave this tenant. Published\nbecause everything else is derived from it \u2014 the certificate's IP SAN,\nthe worker's endpoint, where its clock comes from \u2014 and a value that\nseveral objects are built from should be visible in one place."
                type: string
              namespace:
                description: Namespace the tenant's objects live in.
                type: string
              observedGeneration:
                format: int64
                type: integer
              redundantQuotas:
                description: 'RedundantQuotas are other ResourceQuota objects in this namespace that

                  also cap storage.


                  Reported rather than deleted: another writer put them there, and the

                  folder ceiling sums every quota it finds, so each one is counted again

                  against the folder. Named so somebody can decide.'
                items:
                  type: string
                type: array
              reservation:
                description: Reservation is what was sized from the request, before any of it exists.
                properties:
                  cpu:
                    type: string
                  memory:
                    type: string
                  storage:
                    type: string
                type: object
              talosRelease:
                description: 'TalosRelease is the release resolved from the catalogue, published

                  because "the default" is otherwise invisible and it decides which golden

                  image the workers clone.'
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
