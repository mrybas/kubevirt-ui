apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: managedunderlays.platform.kubevirt-ui.io
spec:
  group: platform.kubevirt-ui.io
  names:
    kind: ManagedUnderlay
    listKind: ManagedUnderlayList
    plural: managedunderlays
    shortNames:
    - mul
    singular: managedunderlay
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.interface
      name: Interface
      type: string
    - jsonPath: .spec.subnetName
      name: Subnet
      type: string
    - jsonPath: .status.conditions[?(@.type=="FabricReady")].status
      name: Fabric
      type: string
    - jsonPath: .status.conditions[?(@.type=="NodesLabelled")].status
      name: Nodes
      type: string
    - jsonPath: .status.labelHeals
      name: Heals
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "ManagedUnderlay is the physical path out of the cluster.\n\nIts children carry ownerReferences, unlike a ManagedVM's. The reasoning is\nthe opposite one: a VM must survive its CR being rolled back, because the\nworkload is the point and the record of it is not. Here the objects *are*\nthe record \u2014 a ProviderNetwork with no ManagedUnderlay behind it is fabric\nnobody is keeping up.\n\nThe consequence is worth stating plainly: deleting this object takes the\nexternal subnet with it, and every egress gateway attached to it. That is\nnot a subtle blast radius, but it is the honest one, and it is the same as\ndeleting the Subnet by hand \u2014 which is exactly what used to happen, with no\nobject anywhere saying what the four pieces had to do with each other."
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object.

              Servers should convert recognized schemas to the latest internal value, and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents.

              Servers may infer this from the endpoint the client submits requests to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: 'ManagedUnderlaySpec describes the physical path out of the cluster that VPC

              egress gateways attach to: a NIC, a VLAN, and an external subnet reachable

              through a network-attachment-definition.'
            properties:
              ciliumImage:
                default: quay.io/cilium/cilium:v1.20.0
                type: string
              ciliumNamespace:
                description: CiliumNamespace is where that DaemonSet goes. Empty means find it.
                type: string
              ciliumSourceIPExempt:
                description: "CiliumSourceIPExempt deploys the DaemonSet that clears source-IP\nverification on VPC gateway endpoints. Unset means decide by looking at\nthe cluster, which is the only answer that has ever been right: the\nform's default of \"no\" was wrong on the one cluster it was asked about.\n\nPer-endpoint on purpose. The global `enable-source-ip-verification:\nfalse` fixes it in one line and disables anti-spoofing for every pod in\nthe cluster \u2014 a bad trade when tenant worker VMs are root-accessible to\ntheir tenants."
                type: boolean
              excludeIPs:
                description: ExcludeIPs are ranges of ExternalCIDR kube-ovn must not allocate from.
                items:
                  type: string
                type: array
              excludeNodes:
                description: "ExcludeNodes are nodes without the dedicated NIC \u2014 typically the control\nplane."
                items:
                  type: string
                type: array
              externalCIDR:
                description: ExternalCIDR is the segment on the other side of that NIC.
                minLength: 1
                type: string
              externalGateway:
                description: ExternalGateway is the upstream address on that segment.
                minLength: 1
                type: string
              interface:
                description: 'Interface is the dedicated NIC for the provider network, e.g. `eth1`.


