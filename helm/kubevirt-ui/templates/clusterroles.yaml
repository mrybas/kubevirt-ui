{{- if .Values.rbac.createRoles }}
---
# KubeVirt UI Admin Role - Full access to VM resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubevirt-ui-admin
  labels:
    {{- include "kubevirt-ui.labels" . | nindent 4 }}
    kubevirt-ui.io/role: "admin"
rules:
  # VMs - full access
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["*"]
  # VM migrations
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstancemigrations"]
    verbs: ["*"]
  # VM templates
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineclusterinstancetypes", "virtualmachineinstancetypes"]
    verbs: ["*"]
  # VNC and serial console subresources
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - virtualmachineinstances/vnc
      - virtualmachineinstances/console
    verbs: ["get", "create"]
  # CDI - full access
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes", "datasources"]
    verbs: ["*"]
  # Storage
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["*"]
  # Snapshots
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["*"]
  # ConfigMaps/Secrets
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["*"]
  # Services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["*"]
  # Network policies
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["*"]
  # NAD
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Pods (for console)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # RoleBindings - manage access
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["*"]
  # ResourceQuotas
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch"]

---
# KubeVirt UI Editor Role - Create/Edit/Delete but no access management
