# Default values for kubevirt-ui

# -- Number of replicas
replicaCount: 1

# =========================================================================
# Backend
# =========================================================================
backend:
  image:
    repository: ghcr.io/mrybas/kubevirt-ui/backend
    pullPolicy: IfNotPresent
    tag: ""  # defaults to .Chart.AppVersion

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1"

  service:
    type: ClusterIP
    port: 8000

  # -- Extra env vars passed to the backend container
  env:
    LOG_LEVEL: INFO
    CORS_ORIGINS: ""
    ENABLE_TENANTS: "false"
    # -- Namespace where kube-ovn-controller Deployment lives. Backend
    # reads this to locate the kube-ovn install instead of doing a
    # cluster-wide Deployment scan. Cluster-wide discovery still runs as
    # a fallback if the Deployment is not found in this namespace.
    KUBE_OVN_NAMESPACE: "kube-ovn"
    # Namespace where Velero runs. Empty → backend discovers it (existing
    # BackupStorageLocation, then the Velero Deployment, then a velero-
    # labelled namespace, then `velero`). Set explicitly (e.g. o0-velero)
    # to skip discovery — required if Velero isn't in the default `velero`
    # ns and no BSL exists yet (creating the first BSL otherwise 404s).
    VELERO_NAMESPACE: ""
    # -- The aggregate every tenant VPC is carved out of, e.g.
    # "10.198.192.0/18". REQUIRED for the wizard's "Isolated" checkbox to do
    # anything: isolation is written as "drop traffic whose peer is another
    # tenant, allow everything else", and this is what scopes that drop.
    # Traffic leaving the aggregate (the internet) matches no rule and stays
    # allowed. Empty → VPCs are created WITHOUT isolation ACLs, the backend
    # logs a warning, and the VPC reports isolated=false.
    #
    # No default on purpose — the right value is a property of your
    # addressing plan, and guessing wrong is worse than not isolating. It
    # must contain every tenant VPC CIDR and NOTHING else: overlap the
    # cluster's pod CIDR and VPC workloads lose DNS (VpcDns forwards to
    # CoreDNS pod IPs); overlap the service CIDR and tenant clusters cannot
    # reach their own control plane. Carve tenants a dedicated block rather
    # than reusing a wide one like 10.0.0.0/8. See docs/deployment.md.
    TENANT_SUPERNET: ""
    # -- Tenant-stack overrides — all optional, backend autodetects/defaults when unset
    # Base domain for tenant API + ingress hostnames: <tenant>.<domain>.
    # Empty → falls back to <ingress_ip>.nip.io. Set to your own wildcard
    # domain (e.g. lab.beardlabs.cc). MUST have a wildcard DNS record
    # (*.<domain> → the ingress/Traefik VIP); used for the tenant API
    # IngressRouteTCP HostSNI + apiserver certSANs, so it must match the
    # kubeconfig server host exactly or TLS passthrough breaks.
    TENANTS_INGRESS_DOMAIN: ""
    # IP external-dns publishes for tenant API hostnames (stamped as
    # external-dns.alpha.kubernetes.io/target on the apiserver ingress —
    # external-dns can't infer it from an IngressRouteTCP). Empty → cluster
    # ingress VIP. Set if external-dns must publish a different address.
    TENANTS_EXTERNAL_DNS_TARGET: ""
    # kube-dns/coredns Service ClusterIP override
    TENANTS_VPCDNS_FORWARD_DNS: ""
    # VPC DNS VIP within service CIDR (default: <service-cidr>.200)
    TENANTS_VPCDNS_VIP: ""
    # Default: registry.k8s.io/kas-network-proxy/proxy-server
    TENANTS_KONNECTIVITY_PROXY_IMAGE: ""
    # Default: registry.k8s.io/kas-network-proxy/proxy-agent
    TENANTS_KONNECTIVITY_AGENT_IMAGE: ""
    # OCI containerDisk image for tenant worker VMs
    TENANTS_DEFAULT_WORKER_IMAGE: ""
    # -- VPC-isolated tenants (advertiseAddress model). All optional.
    # Shared MetalLB VIP that fronts every VPC tenant's apiserver +
    # konnectivity, demultiplexed by per-tenant ports. REQUIRED to create
    # VPC tenants — when empty, choosing a VPC in the wizard returns 422
    # (default-overlay tenants are unaffected). Must be an IP in a MetalLB
    # pool reachable from the tenant VPC.
    TENANTS_CP_DEMUX_VIP: ""
    # MetalLB pool + shared-IP key for the per-tenant cp-lb Services
    # (defaults: traefik / cp-demux).
    TENANTS_CP_METALLB_POOL: ""
    TENANTS_CP_SHARED_IP_KEY: ""
    # CP port pool on the shared VIP (defaults: 20000 / 60000, 2 ports per
    # tenant) and Kamaji-reserved konnectivity ports to avoid (8133,8134).
    TENANTS_CP_PORT_BASE: ""
    TENANTS_CP_PORT_END: ""
    TENANTS_CP_RESERVED_PORTS: ""
    # -- Talos worker support. All optional; only read when a tenant is
    # created with worker_os=talos.
    #
    # The CSR signer image. Pinned by digest in code because upstream ships no
    # versioned tags at all — set this to your own mirror, ideally also by
    # digest.
    TALOS_SIGNER_IMAGE: ""
    # Traefik entryPoint that listens on 50001, used only when tenants share a
    # CP VIP. Talos always dials trustd on that fixed port and puts the host
    # in the TLS SNI, so the tenants are demultiplexed exactly like their
    # apiservers — one passthrough route each, no extra component. The
    # listener itself is a one-time platform change in Traefik's own values:
    #
    #   ports:
    #     trustd:
    #       port: 50001
    #       exposedPort: 50001
    #       protocol: TCP
    #
    # Not needed when each tenant gets its own VIP: then 50001 is published on
    # that tenant's own control-plane Service and nothing is shared.
    TENANTS_TRAEFIK_TRUSTD_ENTRYPOINT: ""

  # -- Extra env vars from secrets/configmaps
  envFrom: []
  #  - secretRef:
  #      name: my-backend-secrets

# =========================================================================
# Frontend (nginx + built SPA)
# =========================================================================
frontend:
  image:
    repository: ghcr.io/mrybas/kubevirt-ui/frontend
    pullPolicy: IfNotPresent
    tag: ""  # defaults to .Chart.AppVersion

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

  service:
    type: ClusterIP
    port: 8080

# =========================================================================
# Metrics
# =========================================================================
metrics:
  # -- Force direct HTTP calls to metrics service (auto-detected when in-cluster).
  #    Set to "false" to force K8s API proxy mode even inside the cluster.
  direct: ""  # "", "true", "false" (empty = auto-detect)

  # -- Override metrics backend (format: namespace/service:port).
  #    Leave empty for auto-discovery (VMSingle CRD → vmsingle label → prometheus label).
  service: ""  # e.g. "victoria-metrics/vmsingle-vmsingle:8429"

# =========================================================================
# General
# =========================================================================
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""  # auto-generated if empty

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# =========================================================================
# Ingress
# =========================================================================
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    # nginx.ingress.kubernetes.io/proxy-body-size: "0"
  hosts:
    - host: kubevirt-ui.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: kubevirt-ui-tls
    #   hosts:
    #     - kubevirt-ui.local

# =========================================================================
# RBAC
# =========================================================================
rbac:
  # -- Create RBAC resources for the ServiceAccount
  create: true
  # -- Cluster-wide access (required for multi-namespace, node listing, etc.)
  clusterWide: true
  # -- Create user-facing ClusterRoles (admin/editor/viewer/platform-admin)
  createRoles: true

# =========================================================================
# Network Policy
# =========================================================================
networkPolicy:
  enabled: false

# =========================================================================
# UI config (mounted as /app/config/config.yaml)
# =========================================================================
config:
  defaultNamespace: default
  vmDefaults:
    cpu: 2
    memory: 2Gi
  ui:
    theme: dark
    language: en
    pagination: 25
  features:
    enableVNCConsole: true
    enableSerialConsole: true
    enableLiveMigration: true
    enableSnapshots: true

# =========================================================================
# Authentication
# =========================================================================
auth:
  # -- Auth type: none | oidc | token
  type: oidc

  # -- Comma-separated list of group names whose members are treated as
  # KubeVirt UI admins (full cluster access). Defaults to the bundled-LLDAP
  # convention "kubevirt-ui-admins"; set to e.g. "admins" or
  # "admins,platform-team" to match your external IdP's groups.
  #
  # Ignored when `auth.type: none`: with authentication off the backend
  # serves a synthetic anonymous user and every request is admin. Checking
  # that user against this list would only be checking a group the backend
  # invented for itself — and pointing this at your own group used to make
  # "auth disabled" answer 403 to everything.
  adminGroups: "kubevirt-ui-admins"

  oidc:
    # -- OIDC issuer URL (public, reachable from the browser)
    issuer: ""
    # -- OIDC issuer URL (internal, backend → IdP). Falls back to issuer.
    issuerInternal: ""
    # -- OIDC client ID
    clientId: "kubevirt-ui"
    # -- Reference to an existing secret that holds the client secret
    clientSecretRef:
      name: ""
      key: "client-secret"

  # -- Optional readonly LDAP bind used by the folder Access tab's group
  # autocomplete (`GET /api/v1/ldap/groups?q=...`). Reuse the same Secret
  # Dex uses for its LDAP connector — point `bindPasswordRef` at the same
  # secret key. Leave `url` empty to fall back to the bundled LLDAP (when
  # enabled) or to a degraded mode where the picker returns empty and the
  # UI falls back to free-text group entry.
  ldap:
    # -- LDAP URL, e.g. "ldaps://ipa.example.com:636" or "ldap://ipa:389"
    url: ""
    # -- Use STARTTLS on a plain ldap:// connection
    startTLS: false
    # -- Bind DN (readonly account)
    bindDN: ""
    # -- Bind password — sourced from a Kubernetes Secret
    bindPasswordRef:
      name: ""
      key: "bindPW"
    # -- Base DN to search for groups, e.g. "cn=groups,cn=accounts,dc=example,dc=com"
    groupBaseDN: ""
    # -- LDAP filter template; `{q}` is replaced by the escaped search query.
    # Default matches FreeIPA's groupOfNames objectClass on the `cn` attribute.
    groupFilter: "(&(objectClass=groupOfNames)(cn=*{q}*))"
    # -- Group attribute that holds the human-readable name
    groupNameAttr: "cn"

  # -- Kubeconfig generation (CLI Access page)
  kubeconfig:
    # -- Externally-reachable Kubernetes API server URL stamped into the
    # generated kubeconfig (e.g. "https://k8s.example.com:6443" or a Talos
    # VIP). When empty the backend falls back to reading the
    # `kube-public/cluster-info` ConfigMap, then to
    # `https://kubernetes.default.svc:443` (which won't work from outside).
    externalApiUrl: ""

# =========================================================================
# DEX (optional built-in OIDC provider)
# =========================================================================
dex:
  enabled: false

  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.38.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

  service:
    type: ClusterIP
    port: 5556

  storage:
    type: memory  # "kubernetes" for production with CRDs

  connectors: []
    # - type: github
    #   id: github
    #   name: GitHub
    #   config:
    #     clientID: $GITHUB_CLIENT_ID
    #     clientSecret: $GITHUB_CLIENT_SECRET
    #     redirectURI: https://kubevirt-ui.example.com/dex/callback

  staticPasswords: []
    # - email: "admin@local"
    #   hash: "$2a$10$..."
    #   username: "admin"
    #   userID: "admin-id"
    #   groups: ["kubevirt-ui-admins"]

  enablePasswordDB: false

  logLevel: "info"  # debug, info, warn, error

  # -- Extra env vars for the Dex container. Useful for OIDC client secrets
  # referenced via `secretEnv:` in staticClients, or any other Dex env-var
  # substitution (e.g. `$LDAP_BIND_PW` inside a connector config).
  extraEnv: []
  #  - name: LDAP_BIND_PW
  #    valueFrom:
  #      secretKeyRef:
  #        name: dex-ldap
  #        key: bindPW

  # -- Extra env vars sourced from Secrets/ConfigMaps. Convenient for bundling
  # multiple OIDC client secrets + LDAP creds into a single Secret.
  envFrom: []
  #  - secretRef:
  #      name: dex-secrets

# =========================================================================
# LLDAP (optional bundled LDAP server for user management)
# =========================================================================
lldap:
  # -- Enable bundled LLDAP. When enabled with Dex, auto-configures LDAP connector.
  enabled: false

  image:
    repository: lldap/lldap
    tag: latest
    pullPolicy: IfNotPresent

  # -- LDAP base DN
  baseDN: "dc=kubevirt,dc=local"
  # -- LLDAP admin username
  adminUser: "admin"
  # -- LLDAP admin password. Change in production!
  # If existingSecret is set, this value is ignored.
  adminPassword: "admin_password"
  # -- JWT secret for LLDAP web UI. Change in production!
  jwtSecret: "change-me-in-production"
  # -- Use existing secret for LLDAP credentials instead of creating one.
  # Secret must have keys: admin-password, jwt-secret
  existingSecret: ""
  # -- Verbose logging
  verbose: "false"

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  persistence:
    enabled: false
    size: "1Gi"
    storageClass: ""
