# Default values for kubevirt-ui

# -- Number of replicas
replicaCount: 1

# =========================================================================
# Backend
# =========================================================================
backend:
  image:
    repository: ghcr.io/mrybas/kubevirt-ui/backend
    pullPolicy: IfNotPresent
    tag: ""  # defaults to .Chart.AppVersion

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1"

  service:
    type: ClusterIP
    port: 8000

  # -- Extra env vars passed to the backend container
  env:
    LOG_LEVEL: INFO
    CORS_ORIGINS: ""
    ENABLE_TENANTS: "false"
    # -- Route golden-image creation through the operator: the backend writes a
    # ManagedImage custom resource and the operator creates the DataVolume, the
    # DataSource and the status. Empty/false → the backend creates the
    # DataVolume itself, exactly as before. Requires the ManagedImage CRD to be
    # installed; with the flag on and the CRD absent the create call answers 503
    # saying so rather than failing as if the import broke.
    #
    # Turning the flag back off does not orphan anything: ownership is stamped
    # on the disk, so images the operator owns keep being deleted through it.
    OPERATOR_IMAGE_ENABLED: ""
    # -- Route VM creation through the operator: the backend writes a ManagedVM
    # and the operator renders the KubeVirt VirtualMachine, its root disk, the
    # cloud-init and the network annotations. Empty/false → the backend renders
    # the machine itself, exactly as before.
    #
    # Independent of OPERATOR_IMAGE_ENABLED; either can be on alone. As with
    # images, deletion and power actions follow ownership rather than the flag,
    # so machines created while it was on keep working after it is turned off.
    OPERATOR_VM_ENABLED: ""
    # -- Write new VM templates as ManagedVMTemplate resources instead of JSON
    # blobs in one cluster-wide ConfigMap. Empty/false → the ConfigMap, as
    # before. Reading always covers both stores, so a template written either
    # way stays usable; and a template that already exists as a resource is
    # edited and deleted as one whatever this says — the flag decides where new
    # ones are written, not where the old ones live.
    OPERATOR_TEMPLATE_ENABLED: ""
    # -- Hand the BGP announcements to the operator: the backend's reconcile
    # loop stops writing the FRRConfiguration and the operator's
    # AnnouncementPolicy takes it over. Empty/false → the backend keeps writing
    # it, as before.
    #
    # This is an ownership switch, not a routing choice, and there is no atomic
    # step for it: this flag lives on a Deployment and the operator's dryRun
    # lives on a custom resource, so the switch is two API calls. Only one order
    # is safe — this flag ON first (writers 1 -> 0, the existing configuration
    # stays and the dataplane does not change), then dryRun off (0 -> 1).
    # Backwards leaves two writers, and frr-k8s merges every FRRConfiguration in
    # its namespace into one FRR: two `router bgp` blocks over one session.
    #
    # hack/announce-cutover.sh walks it, refuses the wrong order, and compares
    # what the operator would write against the live object first.
    OPERATOR_ANNOUNCE_ENABLED: ""
    # -- Hand the egress underlay to the operator: the backend writes one
    # ManagedUnderlay describing the site's physical network, and the operator
    # keeps the ProviderNetwork, Vlan, NAD, Subnet, the gateway node label and
    # the two workaround DaemonSets in line with it. Empty/false → the POST
    # builds them itself, as before.
    #
    # The point is not where the code runs. With this off, the
    # `ovn.kubernetes.io/external-gw` node label is repaired only by a GET, so
    # nothing puts it back unless somebody opens the page. On this lab it sat at
    # an explicit `false` on all three workers; the link-watcher DaemonSet
    # selects on it, so it was scheduled nowhere while `kubectl rollout status`
    # reported success — zero desired pods are all ready. Two hours later both
    # provider links were down and had taken transit and egress with them.
    #
    # Adopting an existing hand-built fabric is safe: the operator merges only
    # the fields it renders and leaves kube-ovn's own defaults alone. Deleting
    # a ManagedUnderlay, however, takes its external Subnet and every gateway
    # attached to it — the children carry ownerReferences on purpose.
    OPERATOR_UNDERLAY_ENABLED: ""
    # -- Write VPCs as ManagedNetwork custom resources: the operator creates the
    # Vpc, its default Subnet, the per-VPC VpcDns, and the service-network route
    # on that resolver. Empty/false → the endpoint writes those itself, as
    # before.
    #
    # The route is the reason. A VpcDns pod cannot reach the cluster resolver's
    # ClusterIP without it, and it used to be applied once at create time —
    # when kube-ovn has not created the Deployment yet — and afterwards only by
    # a person calling the recreate endpoint.
    #
    # What does not move with this flag: the CIDR allocator, namespace
    # validation, VPC peering, and `Subnet.spec.acls`. The isolation reconciler
    # keeps its single ownership of the ACL list until the composer can take it
    # over with a provable no-op.
    #
    # Deleting a VPC then removes the ManagedNetwork and the operator cascades
    # (resolver, subnets, router — in that order, router last). Networks written
    # down by hand default to `deletionPolicy: Retain` and are unaffected.
    #
    # Isolation travels in the object and the operator applies it, so a network
    # is closed before it is reported ready and stays closed if this process
    # dies mid-create. That was the one thing blocking this switch: the subnet
    # is written first and the rules afterwards, and neither waiting nor undoing
    # afterwards survives a crash in between.
    #
    # The operator becomes the single writer of a subnet's ACL list only after
    # proving it can reproduce the live one exactly; a list carrying a rule it
    # cannot account for is named and left to whoever wrote it. Subnets it does
    # own are skipped by the backend's isolation pass — read off the object, not
    # off this flag, so it stays true after the flag goes off.
    OPERATOR_NETWORK_ENABLED: ""
    # -- Hand the worker-bootstrap repair to the operator. Empty/false → the
    # tenant reconcile loop keeps doing it.
    #
    # The repair puts a Kubernetes CA back into a Talos worker template that
    # has none; without it a worker boots, runs a kubelet, and never joins,
    # because nothing files its CSR — the VM looks perfectly healthy throughout.
    #
    # Running it in both places is not dangerous (create-if-absent and a patch
    # to the same value) but it is two writers of one thing, so the order is the
    # usual one: this flag on first, then the operator's tenant domain.
    # -- Create tenants by describing them: the endpoint writes one
    # ManagedTenant and the operator builds it. Empty/false → the request
    # handler builds the whole tenant itself, in one pass, and whatever it does
    # not finish is not finished by anybody.
    #
    # That is the failure this moves. A tenant created by the handler lost the
    # race with its own transit EIP getting an address; the handler logged
    # "ACLs deferred to the next reconcile" and there is no reconcile — the
    # transit wiring has exactly one caller and it is create. Its workers
    # dialled a control plane an ACL was dropping, indefinitely, while every
    # condition the product shows stayed green.
    #
    # New tenants only. The ones that exist are untouched and stay the
    # product's — ownership is the ManagedTenant object — so turning this on
    # rewrites nothing and turning it off orphans nothing.
    #
    # The wizard collects more than ManagedTenant has fields for (worker image,
    # tenant DNS, OIDC group names). With this on, a request carrying one of
    # them is refused and the field is named, rather than accepted and built
    # without it.
    OPERATOR_TENANT_ENABLED: ""
    OPERATOR_TENANT_BOOTSTRAP_ENABLED: ""
    # -- Hand the tenant's time source to the operator. Off, the backend writes
    # the shared chrony Deployment and ConfigMap and the per-tenant NTP Service
    # on every tenant creation.
    #
    # Unlike the flag above, this one is not merely tidiness. The chrony
    # Deployment would have two renderers the moment both sides run, and any
    # difference between them rolls it — chrony is what a joining worker asks
    # for the time, so rolling it during a join is a node that never appears.
    OPERATOR_TENANT_TIME_ENABLED: ""
    # -- Hand a tenant's addon releases to the operator. Off, the create path
    # writes them and the reconcile loop writes any that are missing.
    #
    # Those are two renderers of one HelmRelease and they do not agree. The
    # repair one omits `install.disableWait`, and without it the CNI install
    # waits for workloads the install is supposed to cause, times out, Flux
    # remediates by uninstalling, and the release sits in `uninstalling` for
    # ever — measured on the lab with no nodes registered. It fires only when a
    # release is missing, which is the state a fresh tenant is in, which is
    # exactly when omitting it wedges.
    OPERATOR_TENANT_ADDONS_ENABLED: ""
    # -- Route new VPC peerings through the operator: the endpoint writes one
    # object and the controller writes both ends, or neither, and goes on
    # holding them. Empty/false → the endpoint patches both routers itself and
    # then forgets, which is where the drift comes from.
    #
    # Only new ones. The peerings that exist stay the product's — ownership is
    # the ManagedNetworkPeering object, so turning this on rewrites nothing and
    # turning it off orphans nothing.
    OPERATOR_PEERING_ENABLED: ""
    # -- Namespace where kube-ovn-controller Deployment lives. Backend
    # reads this to locate the kube-ovn install instead of doing a
    # cluster-wide Deployment scan. Cluster-wide discovery still runs as
    # a fallback if the Deployment is not found in this namespace.
    KUBE_OVN_NAMESPACE: "kube-ovn"
    # Namespace where Velero runs. Empty → backend discovers it (existing
    # BackupStorageLocation, then the Velero Deployment, then a velero-
    # labelled namespace, then `velero`). Set explicitly (e.g. o0-velero)
    # to skip discovery — required if Velero isn't in the default `velero`
    # ns and no BSL exists yet (creating the first BSL otherwise 404s).
    VELERO_NAMESPACE: ""
    # -- The aggregate every tenant VPC is carved out of, e.g.
    # "10.198.192.0/18". REQUIRED for the wizard's "Isolated" checkbox to do
    # anything: isolation is written as "drop traffic whose peer is another
    # tenant, allow everything else", and this is what scopes that drop.
    # Traffic leaving the aggregate (the internet) matches no rule and stays
    # allowed. Empty → VPCs are created WITHOUT isolation ACLs, the backend
    # logs a warning, and the VPC reports isolated=false.
    #
    # No default on purpose — the right value is a property of your
    # addressing plan, and guessing wrong is worse than not isolating. It
    # must contain every tenant VPC CIDR and NOTHING else: overlap the
    # cluster's pod CIDR and VPC workloads lose DNS (VpcDns forwards to
    # CoreDNS pod IPs); overlap the service CIDR and tenant clusters cannot
    # reach their own control plane. Carve tenants a dedicated block rather
    # than reusing a wide one like 10.0.0.0/8. See docs/deployment.md.
    TENANT_SUPERNET: ""
    # -- Tenant-stack overrides — all optional, backend autodetects/defaults when unset
    # Base domain for tenant API + ingress hostnames: <tenant>.<domain>.
    # Empty → falls back to <ingress_ip>.nip.io. Set to your own wildcard
    # domain (e.g. lab.beardlabs.cc). MUST have a wildcard DNS record
    # (*.<domain> → the ingress/Traefik VIP); used for the tenant API
    # IngressRouteTCP HostSNI + apiserver certSANs, so it must match the
    # kubeconfig server host exactly or TLS passthrough breaks.
    TENANTS_INGRESS_DOMAIN: ""
    # IP external-dns publishes for tenant API hostnames (stamped as
    # external-dns.alpha.kubernetes.io/target on the apiserver ingress —
    # external-dns can't infer it from an IngressRouteTCP). Empty → cluster
    # ingress VIP. Set if external-dns must publish a different address.
    TENANTS_EXTERNAL_DNS_TARGET: ""
    # kube-dns/coredns Service ClusterIP override
    TENANTS_VPCDNS_FORWARD_DNS: ""
    # VPC DNS VIP within service CIDR (default: <service-cidr>.200)
    TENANTS_VPCDNS_VIP: ""
    # Ingress class for the tenant apiserver route. Empty → cluster default.
    TENANTS_INGRESS_CLASS: ""
    # Address the tenant ingress answers on. Empty → discovered from the
    # ingress controller's Service.
    TENANTS_INGRESS_IP: ""
    # Traefik entrypoint carrying the tenant apiserver (default: websecure).
    TENANTS_TRAEFIK_ENTRYPOINT: ""
    # Management range allowed to reach tenant control planes. Empty → no
    # restriction is programmed.
    TENANTS_MGMT_CIDR: ""
    # Storage class the Talos golden image is imported into. Empty → cluster
    # default. The image is shared, so this is not per-tenant.
    TENANTS_GOLDEN_STORAGE_CLASS: ""
    # Namespace holding the shared Talos golden image (default:
    # kubevirt-ui-system). One image serves every tenant, so it does not live
    # in a tenant namespace.
    TENANTS_GOLDEN_NAMESPACE: ""
    # JSON overriding the offered Talos releases and the Kubernetes range each
    # supports. Empty → the built-in catalogue. A malformed value falls back to
    # the built-in and logs loudly, because the operator who wrote it would
    # otherwise just see their new version fail to appear.
    TENANTS_TALOS_CATALOG: ""
    # Give every tenant its own control-plane VIP instead of sharing one and
    # demultiplexing by port (default: true).
    TENANTS_CP_PER_TENANT_VIP: ""
    # Namespace MetalLB runs in (default: o0-metallb).
    TENANTS_CP_METALLB_NAMESPACE: ""
    # NTP served to tenants that have no egress yet — a worker whose clock is
    # wrong cannot start its kubelet, and reaching a public pool needs the
    # egress the join must not depend on.
    TENANTS_NTP_NAMESPACE: ""
    TENANTS_NTP_FALLBACK: ""
    TENANTS_CHRONY_IMAGE: ""

    # -- B3 routed egress: each VPC is announced upstream with its own leg as
    # next hop, no gateway pods in the path. Declared here even though every
    # value is empty, because a knob nobody knows about is a feature that
    # silently does nothing: with B3_BGP_PEER unset the announcements are
    # simply never generated, and a whole stand shipped that way without a
    # single error anywhere (UAT 2026-08-19, finding A4).
    #
    # Unset B3_BGP_PEER or B3_VPC_GATEWAY → B3 is off.
    B3_BGP_PEER: ""
    B3_VPC_GATEWAY: ""
    # This cluster's ASN and the upstream router's (defaults: 65030 / 65000).
    B3_LOCAL_ASN: ""
    B3_PEER_ASN: ""
    # Namespace frr-k8s runs in. Also names the Role that lets the backend
    # write its FRRConfiguration — one fact, two readers; see
    # `kubevirt-ui.b3FrrNamespace` in _helpers.tpl. Empty → b3.frrNamespace.
    B3_FRR_NAMESPACE: ""
    # kube-ovn subnet the VPC legs live on (default: external).
    B3_EXTERNAL_SUBNET: ""
    # How many nodes announce, and which. The explicit list wins; without it
    # the first N Ready nodes are chosen.
    B3_ANNOUNCE_NODES: ""
    B3_ANNOUNCE_NODE_LIST: ""
    # Default: registry.k8s.io/kas-network-proxy/proxy-server
    TENANTS_KONNECTIVITY_PROXY_IMAGE: ""
    # Default: registry.k8s.io/kas-network-proxy/proxy-agent
    TENANTS_KONNECTIVITY_AGENT_IMAGE: ""
    # OCI containerDisk image for tenant worker VMs
    TENANTS_DEFAULT_WORKER_IMAGE: ""
    # -- VPC-isolated tenants (advertiseAddress model). All optional.
    # Shared MetalLB VIP that fronts every VPC tenant's apiserver +
    # konnectivity, demultiplexed by per-tenant ports. REQUIRED to create
    # VPC tenants — when empty, choosing a VPC in the wizard returns 422
    # (default-overlay tenants are unaffected). Must be an IP in a MetalLB
    # pool reachable from the tenant VPC.
    TENANTS_CP_DEMUX_VIP: ""
    # MetalLB pool + shared-IP key for the per-tenant cp-lb Services
    # (defaults: traefik / cp-demux).
    TENANTS_CP_METALLB_POOL: ""
    TENANTS_CP_SHARED_IP_KEY: ""
    # Name of the kube-ovn Subnet carrying the control-plane transit plane —
    # the one the demux VIP lives on. A VPC tenant gets attached to it, given
    # an EIP + SNAT rule there, and allowed through to the VIP on its own two
    # ports. Leave it empty and VPC tenants come up with no path to their own
    # control plane. The CIDR and address range are read from the Subnet, so
    # there is nothing else to keep in sync.
    TENANTS_CP_TRANSIT_SUBNET: ""
    # Prefix length of one tenant VPC, carved out of TENANT_SUPERNET. Must be
    # what the border router accepts: the lab filter is
    # `10.200.0.0/14{22,22}`, so a /24 announcement is dropped and a VPC
    # created the normal way could not be announced at all. Default /22.
    TENANT_VPC_PREFIX: ""
    # Where an egress gateway's own VPC and transit link are carved from —
    # infrastructure space, deliberately outside TENANT_SUPERNET. Suggestions
    # are checked against the real subnets either way, so a wrong pool yields
    # an empty answer rather than a colliding one.
    EGRESS_GW_CIDR_POOL: ""
    # CP port pool on the shared VIP (defaults: 20000 / 60000, 2 ports per
    # tenant) and Kamaji-reserved konnectivity ports to avoid (8133,8134).
    TENANTS_CP_PORT_BASE: ""
    TENANTS_CP_PORT_END: ""
    TENANTS_CP_RESERVED_PORTS: ""
    # -- Talos worker support. All optional; only read when a tenant is
    # created with worker_os=talos.
    #
    # The CSR signer image. Pinned by digest in code because upstream ships no
    # versioned tags at all — set this to your own mirror, ideally also by
    # digest.
    TALOS_SIGNER_IMAGE: ""
    # Traefik entryPoint that listens on 50001, used only when tenants share a
    # CP VIP. Talos always dials trustd on that fixed port and puts the host
    # in the TLS SNI, so the tenants are demultiplexed exactly like their
    # apiservers — one passthrough route each, no extra component. The
    # listener itself is a one-time platform change in Traefik's own values:
    #
    #   ports:
    #     trustd:
    #       port: 50001
    #       exposedPort: 50001
    #       protocol: TCP
    #
    # Not needed when each tenant gets its own VIP: then 50001 is published on
    # that tenant's own control-plane Service and nothing is shared.
    TENANTS_TRAEFIK_TRUSTD_ENTRYPOINT: ""

  # -- Extra env vars from secrets/configmaps
  envFrom: []
  #  - secretRef:
  #      name: my-backend-secrets

# =========================================================================
# Frontend (nginx + built SPA)
# =========================================================================
frontend:
  image:
    repository: ghcr.io/mrybas/kubevirt-ui/frontend
    pullPolicy: IfNotPresent
    tag: ""  # defaults to .Chart.AppVersion

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

  service:
    type: ClusterIP
    port: 8080

# =========================================================================
# Metrics
# =========================================================================
metrics:
  # -- Force direct HTTP calls to metrics service (auto-detected when in-cluster).
  #    Set to "false" to force K8s API proxy mode even inside the cluster.
  direct: ""  # "", "true", "false" (empty = auto-detect)

  # -- Override metrics backend (format: namespace/service:port).
  #    Leave empty for auto-discovery (VMSingle CRD → vmsingle label → prometheus label).
  service: ""  # e.g. "victoria-metrics/vmsingle-vmsingle:8429"

# =========================================================================
# General
# =========================================================================
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""  # auto-generated if empty

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# =========================================================================
# Ingress
# =========================================================================
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    # nginx.ingress.kubernetes.io/proxy-body-size: "0"
  hosts:
    - host: kubevirt-ui.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: kubevirt-ui-tls
    #   hosts:
    #     - kubevirt-ui.local

# =========================================================================
# RBAC
# =========================================================================
rbac:
  # -- Create RBAC resources for the ServiceAccount
  create: true
  # -- Cluster-wide access (required for multi-namespace, node listing, etc.)
  clusterWide: true
  # -- Create user-facing ClusterRoles (admin/editor/viewer/platform-admin)
  createRoles: true

# =========================================================================
# B3 routed egress — BGP announcements for tenant VPC prefixes
# =========================================================================
# Each VPC is announced to the upstream router with its own leg as next hop;
# no gateway pods sit in the path. The announcement is one FRRConfiguration
# that frr-k8s picks up, written into the namespace where frr-k8s runs.
b3:
  # -- Namespace frr-k8s runs in. ONE fact: it names both the Role the
  # backend needs and the B3_FRR_NAMESPACE it reads — a Role created
  # somewhere other than where the object is written grants nothing.
  frrNamespace: "o0-metallb"

# =========================================================================
# Network Policy
# =========================================================================
networkPolicy:
  enabled: false

# =========================================================================
# UI config (mounted as /app/config/config.yaml)
# =========================================================================
config:
  defaultNamespace: default
  vmDefaults:
    cpu: 2
    memory: 2Gi
  ui:
    theme: dark
    language: en
    pagination: 25
  features:
    enableVNCConsole: true
    enableSerialConsole: true
    enableLiveMigration: true
    enableSnapshots: true

# =========================================================================
# Authentication
# =========================================================================
auth:
  # -- Auth type: none | oidc | token
  type: oidc

  # -- Comma-separated list of group names whose members are treated as
  # KubeVirt UI admins (full cluster access). Defaults to the bundled-LLDAP
  # convention "kubevirt-ui-admins"; set to e.g. "admins" or
  # "admins,platform-team" to match your external IdP's groups.
  #
  # Ignored when `auth.type: none`: with authentication off the backend
  # serves a synthetic anonymous user and every request is admin. Checking
  # that user against this list would only be checking a group the backend
  # invented for itself — and pointing this at your own group used to make
  # "auth disabled" answer 403 to everything.
  adminGroups: "kubevirt-ui-admins"

  oidc:
    # -- OIDC issuer URL (public, reachable from the browser)
    issuer: ""
    # -- OIDC issuer URL (internal, backend → IdP). Falls back to issuer.
    issuerInternal: ""
    # -- OIDC client ID
    clientId: "kubevirt-ui"
    # -- Reference to an existing secret that holds the client secret
    clientSecretRef:
      name: ""
      key: "client-secret"

  # -- Optional readonly LDAP bind used by the folder Access tab's group
  # autocomplete (`GET /api/v1/ldap/groups?q=...`). Reuse the same Secret
  # Dex uses for its LDAP connector — point `bindPasswordRef` at the same
  # secret key. Leave `url` empty to fall back to the bundled LLDAP (when
  # enabled) or to a degraded mode where the picker returns empty and the
  # UI falls back to free-text group entry.
  ldap:
    # -- LDAP URL, e.g. "ldaps://ipa.example.com:636" or "ldap://ipa:389"
    url: ""
    # -- Use STARTTLS on a plain ldap:// connection
    startTLS: false
    # -- Bind DN (readonly account)
    bindDN: ""
    # -- Bind password — sourced from a Kubernetes Secret
    bindPasswordRef:
      name: ""
      key: "bindPW"
    # -- Base DN to search for groups, e.g. "cn=groups,cn=accounts,dc=example,dc=com"
    groupBaseDN: ""
    # -- LDAP filter template; `{q}` is replaced by the escaped search query.
    # Default matches FreeIPA's groupOfNames objectClass on the `cn` attribute.
    groupFilter: "(&(objectClass=groupOfNames)(cn=*{q}*))"
    # -- Group attribute that holds the human-readable name
    groupNameAttr: "cn"

  # -- Kubeconfig generation (CLI Access page)
  kubeconfig:
    # -- Externally-reachable Kubernetes API server URL stamped into the
    # generated kubeconfig (e.g. "https://k8s.example.com:6443" or a Talos
    # VIP). When empty the backend falls back to reading the
    # `kube-public/cluster-info` ConfigMap, then to
    # `https://kubernetes.default.svc:443` (which won't work from outside).
    externalApiUrl: ""

# =========================================================================
# DEX (optional built-in OIDC provider)
# =========================================================================
dex:
  enabled: false

  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.38.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

  service:
    type: ClusterIP
    port: 5556

  storage:
    type: memory  # "kubernetes" for production with CRDs

  connectors: []
    # - type: github
    #   id: github
    #   name: GitHub
    #   config:
    #     clientID: $GITHUB_CLIENT_ID
    #     clientSecret: $GITHUB_CLIENT_SECRET
    #     redirectURI: https://kubevirt-ui.example.com/dex/callback

  staticPasswords: []
    # - email: "admin@local"
    #   hash: "$2a$10$..."
    #   username: "admin"
    #   userID: "admin-id"
    #   groups: ["kubevirt-ui-admins"]

  enablePasswordDB: false

  logLevel: "info"  # debug, info, warn, error

  # -- Extra env vars for the Dex container. Useful for OIDC client secrets
  # referenced via `secretEnv:` in staticClients, or any other Dex env-var
  # substitution (e.g. `$LDAP_BIND_PW` inside a connector config).
  extraEnv: []
  #  - name: LDAP_BIND_PW
  #    valueFrom:
  #      secretKeyRef:
  #        name: dex-ldap
  #        key: bindPW

  # -- Extra env vars sourced from Secrets/ConfigMaps. Convenient for bundling
  # multiple OIDC client secrets + LDAP creds into a single Secret.
  envFrom: []
  #  - secretRef:
  #      name: dex-secrets

# =========================================================================
# LLDAP (optional bundled LDAP server for user management)
# =========================================================================
lldap:
  # -- Enable bundled LLDAP. When enabled with Dex, auto-configures LDAP connector.
  enabled: false

  image:
    repository: lldap/lldap
    tag: latest
    pullPolicy: IfNotPresent

  # -- LDAP base DN
  baseDN: "dc=kubevirt,dc=local"
  # -- LLDAP admin username
  adminUser: "admin"
  # -- LLDAP admin password. Change in production!
  # If existingSecret is set, this value is ignored.
  adminPassword: "admin_password"
  # -- JWT secret for LLDAP web UI. Change in production!
  jwtSecret: "change-me-in-production"
  # -- Use existing secret for LLDAP credentials instead of creating one.
  # Secret must have keys: admin-password, jwt-secret
  existingSecret: ""
  # -- Verbose logging
  verbose: "false"

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  persistence:
    enabled: false
    size: "1Gi"
    storageClass: ""

# ---------------------------------------------------------------------------
# The operator
# ---------------------------------------------------------------------------
#
# Its CRDs and its ClusterRole are generated from the operator's own sources by
# hack/sync-operator-chart.py and checked by a test, so the chart cannot install
# last year's schema while the code has moved on.
#
# The site facts below have no defaults on purpose. Every one of them has
# already been wrong once, and each time the failure was silent: kube-ovn in a
# namespace that was not "kube-ovn" left an adopted tenant waiting for a
# ConfigMap for ever, and a transit-subnet variable spelled differently in two
# places meant an invariant never ran while "no complaint" read as "checked".
# A chart that guesses would reproduce both.
operator:
  enabled: false
  image:
    repository: ghcr.io/mrybas/kubevirt-ui/operator
    # Defaults to the chart's appVersion, so the operator and the backend that
    # hands work to it ship as one thing.
    tag: ""
    pullPolicy: IfNotPresent
  crds:
    # Templated rather than put in crds/, because Helm never upgrades what is in
    # crds/ — the schema would silently stay at the version first installed.
    # They carry resource-policy keep, so uninstalling the UI does not
    # cascade-delete every tenant, network and VM described by them.
    install: true
  webhooks:
    # Admission belongs to one deployment or none: it is served by the vm
    # deployment, and the chart refuses to render a configuration pointing at a
    # service that domain would not provide.
    #
    # Off by default, and the reason is the failure mode rather than caution:
    # two of the three webhooks are `failurePolicy: Fail`, so between the
    # configuration existing and the certificate being issued, every
    # ManagedTenant and ManagedVM write is rejected. On is right for a cluster
    # that has cert-manager and wants the validation; the product's create
    # endpoint passes the webhook's refusal through as a 400, and that message
    # is the only sentence saying which field is wrong.
    #
    # Requires cert-manager: the certificate and the CA injection are its
    # objects. There is no way to check that from a template, so it is said
    # here instead.
    enabled: false
  domains:
    vm:
      enabled: true
      replicas: 1
    network:
      enabled: true
      replicas: 1
    tenant:
      enabled: true
      replicas: 1
  config:
    # The namespace kube-ovn actually runs in. Required by tenant and network.
    kubeOvnNamespace: ""
    # Where control-plane VIPs come from. Required by tenant.
    metallbNamespace: ""
    metallbPool: ""
    # The transit subnet those VIPs must sit inside. Required by tenant.
    cpTransitSubnet: ""
    # The suffix a tenant apiserver is reached by from outside. Required by
    # tenant: without it the certificate carries no such SAN.
    ingressDomain: ""
    # The aggregate every tenant network is carved from, e.g. 10.200.0.0/14.
    # Required by the network domain, and for a reason worth the refusal: empty
    # means no isolation is written at all, and the VPC that results is
    # attached, routed, healthy-looking and open to every other tenant while the
    # UI's review step says "Isolated: Yes".
    #
    # The same fact the backend reads as TENANT_SUPERNET. Set it in one place —
    # either here or there — and the chart refuses to render if both are set and
    # disagree.
    tenantSupernet: ""
    # Optional. Prefixes of the management plane, which must not open
    # connections into a tenant. Empty means each node's own address as a /32,
    # which is right for a flat management network and too narrow for a routed
    # one.
    mgmtCIDRs: []
    # The address external-dns should publish for tenant API names. Optional
    # only in the sense that the chart installs without it: external-dns cannot
    # infer an address from an IngressRouteTCP, so with this empty the route is
    # written, the name is in the certificate, and nothing resolves it. The
    # tenant reports that as ExternallyReachable=False rather than looking
    # healthy while its kubeconfig cannot be used.
    externalDNSTarget: ""
    # Traefik entry points, when this cluster names them differently. The
    # defaults are Traefik's own `websecure` and a `trustd` listener on 50001.
    traefikEntryPoint: ""
    traefikTrustdEntryPoint: ""
    # Optional. The cluster's service network. Read from the cluster when
    # absent — the kubeadm ConfigMap, else the apiserver's own flag — and needed
    # explicitly where neither is readable, which is every managed control
    # plane.
    serviceCIDR: ""
    # Optional. A tenant may opt into OIDC; if an issuer is set, so must be the
    # client id.
    oidcIssuer: ""
    oidcClientId: ""
  extraEnv: {}
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
