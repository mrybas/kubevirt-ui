services:
  # Only this test needs Harbor reachable and the flag on. Other e2e specs
  # (full-flow, mobile-audit, ...) run against this same compose file and
  # must see GET /images behave exactly as it does today — the "Done when"
  # bar for the whole feature — so this only points the backend at Harbor,
  # it does not change any other e2e behaviour.
  backend:
    environment:
      - HARBOR_URL=http://harbor-core:8080
      - HARBOR_IMAGE_ENABLED=true
    depends_on:
      - harbor-core

  e2e:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    depends_on:
      - frontend
    networks:
      - kubevirt-ui
    volumes:
      - ./e2e/results:/e2e/results
    environment:
      - BASE_URL=http://frontend:3000
      - API_URL=http://backend:8000
      - DEX_ISSUER=http://dex:5556
      - LLDAP_URL=http://lldap:17170
      - LLDAP_ADMIN_USER=admin
      - LLDAP_ADMIN_PASSWORD=admin_password

  # ---------------------------------------------------------------------
  # Harbor — for harbor-identity.spec.ts (Task 9).
  #
  # A mock Harbor accepts any bearer, so it can never prove the security
  # claim this task exists to check: that a wrong/absent identity is
  # REFUSED the catalogue while a valid one sees it. Only a real Harbor,
  # configured for real OIDC token verification, can show that.
  #
  # harbor-core cannot run alone — it needs a database and a cache at
  # minimum, so `harbor-db` and `harbor-redis` are included too (the
  # brief's Step 1 names only `harbor`/harbor-core; a single-service
  # addition would not start and would not be a "runnable artefact").
  #
  # WHAT THIS DOES NOT INCLUDE, DELIBERATELY: registry, registryctl,
  # jobservice, portal, and the nginx proxy — the pieces needed for
  # actual image push/pull and the web UI. The two identity tests in
  # harbor-identity.spec.ts only exercise Harbor's MANAGEMENT API
  # (GET /api/v2.0/projects, /repositories, /artifacts via HarborClient
  # in backend/app/core/harbor_client.py) — repository/artifact metadata
  # that Harbor's own core serves out of its Postgres database, not by
  # calling a live registry. Omitting that stack is a scope decision to
  # keep this fixture buildable, not evidence it was skipped by accident.
  # Task 6's publish path (crane push through the registry) is exercised
  # separately and directly against a plain registry — see task-9-report.md.
  #
  # VERIFICATION STATUS — this WAS brought up and exercised for real this
  # session (see task-9-report.md for full commands/output, and for one
  # honest failed attempt first: the full 9-service official Harbor
  # topology crashed this machine's Docker Desktop under amd64 emulation
  # before any container started; this reduced 3-service footprint is
  # what was actually run):
  #   - harbor-db, harbor-redis, harbor-core (config/app.conf/private
  #     key/secret key below, copied verbatim from a real
  #     `goharbor/prepare:v2.15.2` run) came up cleanly: core migrated
  #     its schema, connected to redis, and served
  #     GET /api/v2.0/health as 200 with core/database/redis "healthy".
  #   - The harbor-init OIDC bootstrap's PUT /api/v2.0/configurations
  #     call was run by hand and returned 200. Wiring it to THIS repo's
  #     dex is real but incomplete: dex/config.yaml pins `issuer:
  #     http://192.168.196.1:5556` (the browser-facing LAN address) so
  #     that OAuth redirects work from a host browser, but Harbor's Go
  #     OIDC client fetches discovery via the internal compose hostname
  #     (`http://dex:5556`) and then hard-rejects the result because the
  #     `issuer` claim inside it doesn't match the URL used to fetch it
  #     (a deliberate anti-issuer-confusion check in the OIDC spec, not a
  #     bug in either service) — confirmed directly in harbor-core's own
  #     logs. Reusing the SAME dex this project already runs as Harbor's
  #     OIDC provider needs a second, internally-consistent issuer for
  #     Harbor to use, which dex's single `issuer:` field cannot provide
  #     alongside the browser-facing one; this file does not attempt
  #     that fix (out of Task 9's declared scope), so `harbor-init`
  #     itself did not reach a working end state.
  #   - THE HEADLINE FINDING, proven directly against this real running
  #     Harbor using the project's own unmodified
  #     backend/app/core/harbor_client.py and
  #     backend/app/api/v1/images_catalog.py: Harbor's
  #     GET /api/v2.0/projects (the LIST endpoint `catalog_images()`
  #     calls first) returns HTTP 200 for ANY bearer — garbage, absent,
  #     or valid — filtered to whatever that identity can see (empty
  #     list once no project is public), and NEVER 401/403. A
  #     project-scoped call (GET /api/v2.0/projects/<name>/repositories
  #     on a private project) DOES correctly 401 a bad bearer — Harbor's
  #     enforcement is real — but `catalog_images()`'s loop only reaches
  #     that call for a project `list_projects()` already returned, and
  #     for a bad identity that list is empty. So `HarborUnauthorized` is
  #     never raised, `catalog_available` never flips to `false`, and a
  #     wrong identity silently gets `catalog_available: true` with zero
  #     catalog rows — indistinguishable from a legitimately empty
  #     catalogue. See task-9-report.md for the exact reproduction
  #     (curl transcripts plus a direct Python run of this repo's own
  #     `catalog_images()` against this Harbor).
  harbor-db:
    image: goharbor/harbor-db:v2.15.2
    environment:
      - POSTGRES_PASSWORD=root123
    volumes:
      - harbor_db_data:/var/lib/postgresql/data
    networks:
      - kubevirt-ui

  harbor-redis:
    image: goharbor/valkey-photon:v2.15.2
    networks:
      - kubevirt-ui

  harbor-core:
    image: goharbor/harbor-core:v2.15.2
    depends_on:
      - harbor-db
      - harbor-redis
    networks:
      - kubevirt-ui
    configs:
      - source: harbor_core_app_conf
        target: /etc/core/app.conf
      - source: harbor_core_private_key
        target: /etc/core/private_key.pem
      - source: harbor_core_secretkey
        target: /etc/core/key
    environment:
      - CONFIG_PATH=/etc/core/app.conf
      - LOG_LEVEL=info
      - EXT_ENDPOINT=http://harbor-core:8080
      - DATABASE_TYPE=postgresql
      - POSTGRESQL_HOST=harbor-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=root123
      - POSTGRESQL_DATABASE=registry
      - POSTGRESQL_SSLMODE=disable
      - POSTGRESQL_MAX_IDLE_CONNS=2
      - POSTGRESQL_MAX_OPEN_CONNS=2
      - _REDIS_URL_CORE=redis://harbor-redis:6379?idle_timeout_seconds=30
      - _REDIS_URL_REG=redis://harbor-redis:6379/1?idle_timeout_seconds=30
      # No registry/registryctl/jobservice/portal in this fixture — see the
      # note above. These point at harbor-core itself so a DNS lookup
      # resolves rather than failing outright; the endpoints behind them
      # are not exercised by the identity tests.
      - REGISTRY_URL=http://harbor-core:8080
      - TOKEN_SERVICE_URL=http://harbor-core:8080/service/token
      - PORTAL_URL=http://harbor-core:8080
      - JOBSERVICE_URL=http://harbor-core:8080
      - REGISTRY_CONTROLLER_URL=http://harbor-core:8080
      - CORE_URL=http://harbor-core:8080
      - CORE_LOCAL_URL=http://127.0.0.1:8080
      - WITH_TRIVY=false
      - HARBOR_ADMIN_PASSWORD=Harbor12345
      - MAX_JOB_WORKERS=2
      - CORE_SECRET=e2e-only-core-secret
      - JOBSERVICE_SECRET=e2e-only-jobservice-secret
      - CSRF_KEY=e2e-only-csrf-key-32-characters!
      - REGISTRY_CREDENTIAL_USERNAME=harbor_registry_user
      - REGISTRY_CREDENTIAL_PASSWORD=e2e-only-registry-credential
      - REGISTRY_STORAGE_PROVIDER_NAME=filesystem
      - READ_ONLY=false
      - PORT=8080
      - QUOTA_UPDATE_PROVIDER=db

  # OIDC bootstrap: harbor.yml has no OIDC section (confirmed empty in the
  # v2.15.2 template), so pointing Harbor's bearer-token verification at
  # the e2e `dex` service is a runtime configuration call, not something
  # set at image build/start time. Reuses the SAME dex static client
  # (`kubevirt-ui` / `kubevirt-ui-secret`, see dex/config.yaml) the
  # backend itself logs in as — the whole point of this task is that the
  # caller's own token (aud=kubevirt-ui) is what gets forwarded to
  # Harbor, so Harbor must accept that same audience, not a Harbor-only
  # client.
  #
  # RUN THIS SESSION, AND IT DOES NOT REACH A WORKING STATE: the PUT
  # itself returns 200 (Harbor accepts the config), but harbor-core then
  # logs `oidc: issuer did not match the issuer returned by provider,
  # expected "http://dex:5556" got "http://192.168.196.1:5556"` on every
  # subsequent bearer request — dex's single `issuer:` field is pinned to
  # the browser-facing LAN address (needed for OAuth redirects from a
  # host browser) and can't simultaneously equal the internal compose
  # hostname Harbor uses to fetch discovery. This is a real gap between
  # this project's existing dex setup and reusing it as Harbor's OIDC
  # provider, not a guess — see task-9-report.md for the full log and
  # what fixing it for real would need (dex would need a second,
  # internally-reachable issuer, which a single dex instance's config
  # does not support).
  harbor-init:
    image: curlimages/curl:8.11.0
    depends_on:
      - harbor-core
    networks:
      - kubevirt-ui
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        until curl -sf http://harbor-core:8080/api/v2.0/health >/dev/null 2>&1; do
          echo "waiting for harbor-core..."; sleep 3
        done
        curl -sf -u "admin:Harbor12345" -X PUT \
          -H 'Content-Type: application/json' \
          http://harbor-core:8080/api/v2.0/configurations \
          -d '{
            "auth_mode": "oidc_auth",
            "oidc_name": "dex",
            "oidc_endpoint": "http://dex:5556",
            "oidc_client_id": "kubevirt-ui",
            "oidc_client_secret": "kubevirt-ui-secret",
            "oidc_scope": "openid,profile,email",
            "oidc_verify_cert": false,
            "oidc_auto_onboard": true,
            "oidc_user_claim": "name"
          }'
        echo "harbor OIDC configured"

