# Build & push Docker images and Helm chart for KubeVirt UI
# Triggered on CalVer tags (2026.01.0, etc.), on the operator-dev branch, or
# manual dispatch.
#
# Two tagging worlds that must never mix: a CalVer tag is a release and also
# moves `latest`; a branch build is a dev image tagged `dev-<sha7>` and moves
# nothing. A dev image that could be pulled as `latest` would eventually be
# deployed as one.

name: Build Images

on:
  push:
    tags: ['20*']
    branches: ['operator-dev']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Prepare: compute image tags once, reuse in build jobs
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tags_backend: ${{ steps.meta.outputs.tags_backend }}
      tags_frontend: ${{ steps.meta.outputs.tags_frontend }}
      tags_operator: ${{ steps.meta.outputs.tags_operator }}
      version: ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          REGISTRY="${{ env.REGISTRY }}"
          REPO="${{ github.repository }}"

          BACKEND_IMAGE="${REGISTRY}/${REPO}/backend"
          FRONTEND_IMAGE="${REGISTRY}/${REPO}/frontend"
          OPERATOR_IMAGE="${REGISTRY}/${REPO}/operator"

          TAGS_BACKEND=""
          TAGS_FRONTEND=""
          TAGS_OPERATOR=""

          add_tag() {
            TAGS_BACKEND="${TAGS_BACKEND:+${TAGS_BACKEND},}${BACKEND_IMAGE}:${1}"
            TAGS_FRONTEND="${TAGS_FRONTEND:+${TAGS_FRONTEND},}${FRONTEND_IMAGE}:${1}"
            TAGS_OPERATOR="${TAGS_OPERATOR:+${TAGS_OPERATOR},}${OPERATOR_IMAGE}:${1}"
          }

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            IS_RELEASE="true"
            VERSION="${GITHUB_REF#refs/tags/}"
            add_tag "${VERSION}"
            add_tag "latest"
          else
            # Dev build from a branch: never `latest`, never CalVer-shaped.
            IS_RELEASE="false"
            VERSION="dev-${GITHUB_SHA::7}"
            add_tag "${VERSION}"
          fi

          echo "tags_backend=${TAGS_BACKEND}" >> "$GITHUB_OUTPUT"
          echo "tags_frontend=${TAGS_FRONTEND}" >> "$GITHUB_OUTPUT"
          echo "tags_operator=${TAGS_OPERATOR}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

          echo "### Image Tags" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release:** ${IS_RELEASE}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Backend:** ${TAGS_BACKEND}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Frontend:** ${TAGS_FRONTEND}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Operator:** ${TAGS_OPERATOR}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build backend image
  # ---------------------------------------------------------------------------
  build-backend:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: ${{ needs.prepare.outputs.tags_backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.title=kubevirt-ui-backend
            org.opencontainers.image.description=KubeVirt UI Backend API

  # ---------------------------------------------------------------------------
  # Build frontend image
  # ---------------------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: ${{ needs.prepare.outputs.tags_frontend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.title=kubevirt-ui-frontend
            org.opencontainers.image.description=KubeVirt UI Frontend

  # ---------------------------------------------------------------------------
  # Build operator image
  # ---------------------------------------------------------------------------
  build-operator:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push operator
        uses: docker/build-push-action@v5
        with:
          context: ./operator
          file: ./operator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.prepare.outputs.tags_operator }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.title=kubevirt-ui-operator
            org.opencontainers.image.description=KubeVirt UI Operator

  # ---------------------------------------------------------------------------
  # Package and push Helm chart to OCI registry
  # ---------------------------------------------------------------------------
  helm-package:
    runs-on: ubuntu-latest
    needs: prepare
    # The dev operator is deployed with kustomize, deliberately bypassing the
    # chart and Flux, so a branch build must not publish a chart version.
    if: needs.prepare.outputs.is_release == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Chart.yaml with release version
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" helm/kubevirt-ui/Chart.yaml
          sed -i "s/^version:.*/version: ${VERSION}/" helm/kubevirt-ui/Chart.yaml

      - name: Package Helm chart
        run: helm package helm/kubevirt-ui/

      - name: Log in to OCI registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push Helm chart
        run: helm push kubevirt-ui-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository }}/charts
